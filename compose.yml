# Local development stack. Production runs on Google Cloud (infra/); locally the same ports are
# served by hermetic stand-ins: Postgres with pgvector, the Cloud Storage and Cloud Tasks
# emulators (port contract tests run against them), and Redis for the shared rate limiter.
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: ai }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  gcs:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -port 4443 -public-host localhost:4443
    ports: ["4443:4443"]
  tasks:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    command: -host 0.0.0.0 -port 8123 -initial-queue projects/dev/locations/here/queues/runs
    ports: ["8123:8123"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://app_rw:local-dev-only@db/ai
      CHECKPOINT_DATABASE_URL: postgresql://app_rw:local-dev-only@db/ai
      ALLOW_UNAUTHENTICATED_TASKS: "1"
    ports: ["8080:8080"]
