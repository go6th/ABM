services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: ai }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  # S3-compatible object storage for raw provider payloads. SeaweedFS instead of MinIO because
  # MinIO removed its community images from Docker Hub in 2025 (minio/minio no longer resolves)
  # and dl.min.io returns 410. SeaweedFS serves the same S3 API; the client is boto3 either way.
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports: ["9000:8333", "9001:9333"]
    volumes: [objectstore_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    env_file: .env
    environment:
       DATABASE_URL: postgresql+asyncpg://app_rw:dev@db/ai
       CHECKPOINT_DATABASE_URL: postgresql://app_rw:dev@db/ai
       REDIS_URL: redis://redis:6379/0
       ENV: dev
    ports: ["8080:8080"]
  inngest:
    image: inngest/inngest
    command: inngest dev -u http://api:8080/api/inngest
    ports: ["8288:8288"]

volumes:
  objectstore_data:
