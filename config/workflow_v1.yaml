version: "2026-10-02.1"
settings:
  execution_mode: sequential
  concurrency: 1
  slice_seconds: 240
  max_slices: 60
  max_calls: 60
  max_budget_usd: 5.0
  approval_timeout_hours: 24
  planner_gap_passes: 2
  gate_cycles: 3
  verification_queries_per_lead: 3
  verification_repasses: 1
  graph_version: "2026-10-02.1"
  soft_budget_shares_source: "TODO, needs product owner; configured shares are provisional allocations"
  unsourced_loop_caps: "TODO, needs product owner or connector-specific cap; see individual stages"
  judge_profile: "TODO, needs product owner; must resolve to a model distinct from the generator"
stages:
  - {id: setup, name: Setup, depends_on: [], allowed_tools: [web_search], budget_share: 0.03, loop_cap: 0, coverage: []}
  - {id: pass1_relationship, name: Pass 1 relationship, depends_on: [setup], allowed_tools: [people_search, profile_enrichment], budget_share: 0.07, loop_cap: 0, coverage: [P1.01, P1.02, P1.03, P1.04, P1.05, P2.15]}
  - {id: baseline, name: Baseline, depends_on: [pass1_relationship], allowed_tools: [web_search, page_read], budget_share: 0.12, loop_cap: 8, coverage: [P2.02, P2.03, P2.11, P2.12, P2.23, P2.25]}
  - {id: news, name: News, depends_on: [baseline], allowed_tools: [web_search, page_read, news_feed], budget_share: 0.12, loop_cap: 8, coverage: [P2.01, P2.22, P2.24, P2.28]}
  - {id: jobs, name: Jobs, depends_on: [news], allowed_tools: [job_board], budget_share: 0.16, loop_cap: 12, coverage: [P2.04, P2.05, P2.06]}
  - {id: tech, name: Technology, depends_on: [jobs], allowed_tools: [tech_detection], budget_share: 0.07, loop_cap: 1, coverage: [P2.07]}
  - {id: people, name: People, depends_on: [tech], allowed_tools: [people_search, profile_enrichment], budget_share: 0.12, loop_cap: 12, coverage: [P2.08, P2.09, P2.10, P2.27]}
  - {id: name_searches, name: Person name searches, depends_on: [people], allowed_tools: [web_search, page_read], budget_share: 0.08, loop_cap: 10, coverage: [P2.13, P2.16, P2.17, P2.18, P2.19, P2.20, P2.21, P2.26]}
  - {id: verification, name: Lead verification, depends_on: [name_searches], allowed_tools: [web_search, page_read, job_board, news_feed, people_search], budget_share: 0.08, loop_cap: 3, coverage: [P2.14]}
  - {id: distill_grade, name: Distill and grade, depends_on: [verification], allowed_tools: [], budget_share: 0.03, loop_cap: 2, coverage: []}
  - {id: build, name: Build deliverables, depends_on: [distill_grade], allowed_tools: [], budget_share: 0.04, loop_cap: 0, coverage: []}
  - {id: gate, name: Quality gate, depends_on: [build], allowed_tools: [], budget_share: 0.04, loop_cap: 3, coverage: []}
  - {id: deliver, name: Deliver, depends_on: [gate], allowed_tools: [], budget_share: 0.04, loop_cap: 0, coverage: []}
