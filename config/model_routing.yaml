# Model routing (D-48, D-51): task kind -> tier -> ordered candidate ladder. INTERNAL.
# This file is the ONLY place a model id appears (R1). Every candidate fact (model id, context
# window, data classes, retention, caching, price) carries a source or is null with a status:
# unknown is null, surfaced as a warning, never defaulted. Changes to this file need a benchmark
# report id in docs/routing/DECISIONS.md and a passing eval gate (R12, D-51).
version: "2026-10-06.1"
status: proposal
decisions: [D-48, D-51]
routing_version: "r1"
benchmark_report: {value: null, source: "TODO: no benchmark has run (needs golden accounts, model access, credits)"}

# Task kinds (R2). Every LlmPort call site names one. Extraction and classification go to the
# extractor tier; synthesis, hypotheses, narrative, planning and distill to the planner tier;
# verification to the judge tier (ARCH tier table; roadmap). Knobs are fixed per task kind (R7);
# max_tokens values are today's call-site values; temperature is null because the installed SDK
# (anthropic 1.11.0) has no temperature parameter (OI-LLM-1, verified 2026-10-06).
task_kinds:
  status: proposal
  value:
    plan_gaps:              {tier: planner,   max_tokens: 2000, temperature: null, cacheable: true}
    extract_facts:          {tier: extractor, max_tokens: 4000, temperature: null, cacheable: true}
    classify_posting:       {tier: extractor, max_tokens: 400,  temperature: null, cacheable: true}
    second_pass_posting:    {tier: judge,     max_tokens: 400,  temperature: null, cacheable: true}
    classify_person:        {tier: extractor, max_tokens: 800,  temperature: null, cacheable: true}
    lead_queries:           {tier: planner,   max_tokens: 2000, temperature: null, cacheable: true}
    synthesise_hypotheses:  {tier: planner,   max_tokens: 2000, temperature: null, cacheable: true}
    write_narrative:        {tier: planner,   max_tokens: 2000, temperature: null, cacheable: true}
    distill:                {tier: planner,   max_tokens: 2000, temperature: null, cacheable: true}
    support_judge:          {tier: judge,     max_tokens: 200,  temperature: null, cacheable: true}
    source_reread:          {tier: judge,     max_tokens: 600,  temperature: null, cacheable: false}
    narrative_reread:       {tier: judge,     max_tokens: 400,  temperature: null, cacheable: false}

# Tiers: a fallback chain within a tier before degrading quality (ARCH). A call served by any
# candidate other than the first is recorded `degraded`. After `fallback_after_retryable`
# retryable failures on one candidate the next attempt goes to the next candidate (selection,
# never a retry loop: the node RetryPolicy owns attempts).
tiers:
  status: proposal
  value:
    planner:   {ladder: [strong], fallback_after_retryable: 2}
    extractor: {ladder: [fast, strong], fallback_after_retryable: 2}
    judge:     {ladder: [strong], fallback_after_retryable: 2}
  judge_tier: judge

# Candidates. `family` decides judge independence (D-48): the judge's family must differ from the
# family that produced the claims. Only one family is configured today, so every verification is
# "not independent" and Confirmed claims are capped (G12) until a second family is added: an open
# question for the product owner (see docs/routing/DECISIONS.md).
candidates:
  fast:
    adapter: anthropic_api
    provider_code: m_a
    family: {value: claude, source: "config/models.yaml profile fast"}
    model: {value: claude-haiku-4-5-20251001, source: "config/models.yaml profile fast; V1 [VERIFY]"}
    context_window: {value: null, status: "TODO [VERIFY] V1: not read from the provider's docs"}
    data_classes: {value: [public_web], status: "proposal (V5: public web only until zero retention is verified)"}
    zero_retention: {value: null, status: "TODO [VERIFY] V5"}
    caching: {value: null, status: "TODO [VERIFY] V2: the SDK has a cache_control parameter; support per model not verified"}
    price: {input_usd_per_mtok: null, output_usd_per_mtok: null, source: "TODO: provider price list"}
  strong:
    adapter: anthropic_api
    provider_code: m_a
    family: {value: claude, source: "config/models.yaml profile strong"}
    model: {value: claude-opus-5-5, source: "config/models.yaml profile strong; V1 [VERIFY]"}
    context_window: {value: null, status: "TODO [VERIFY] V1"}
    data_classes: {value: [public_web], status: "proposal (V5)"}
    zero_retention: {value: null, status: "TODO [VERIFY] V5"}
    caching: {value: null, status: "TODO [VERIFY] V2"}
    price: {input_usd_per_mtok: null, output_usd_per_mtok: null, source: "TODO: provider price list"}

# R9: token cap per run per depth tier (ARCH names the cap; no source gives a number).
token_caps:
  status: "TODO, needs product owner"
  value: {standard: null, deep: null}

# Candidate health (shared circuit state, not a ledger).
health:
  status: proposal
  failure_threshold: 3
  window_s: 120
  cooldown_s: 60

# R10: alert when the cache-read ratio of cacheable calls is below 70% (ARCH); the alert itself
# lives in the observability work package.
cache_read_ratio_floor: {value: 0.70, source: "ARCH: alert when cache-read ratio < 70% on cacheable calls"}
schema_reasks: {value: 1, source: "workflow spec 3.7: one bounded re-ask"}
