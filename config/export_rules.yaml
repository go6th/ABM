# Export content rules. Every entry carries `source` (a document and section, or a legacy file and
# line) or `status: proposal` (a default proposed by the build, decision named) or
# `source: "TODO, needs product owner"` (nobody defines it yet). A test fails on an entry with
# none of these. Lists the sources do not give are EMPTY, never invented (spec 2.1).
version: "1.0.0"
status: proposal
decision: D-24

delivery:
  # When enabled, Word, deck, and PDF deliverables are produced only if all gates pass.
  # When disabled, they are refused with a clear message.
  enabled: true
  source: "owner decision 2026-10-18: Word, deck and PDF delivery enabled in this release, gated"
  render_checks: false
  render_checks_source: "D-24 proposal; enabled per environment in deployment config"

attribution:
  # PRD s3.4 / SKILL rule 6: client-facing output is attributed to "6th agents".
  name: "6th agents"
  source: "PRD s3.4; skill rule 6"

# Fixed document properties (B2, B10): nothing else is written into core or app properties.
document_properties:
  author: "6th agents"
  company: "6th agents"
  source: "PRD s3.4 attribution; spec B2 (no machine, user or tool names)"

# PRD s3.4 research rules: "Sensitive findings ... are preparation, never openers, and the file
# says so." The sentence is rendered in every Summary.
sensitive_sentence:
  text: "Sensitive findings, such as a breach, a layoff or a lawsuit, are preparation for the conversation and never an opener."
  source: "PRD s3.4 research rules (the rule); wording: proposal D-24"
  status: proposal

banned_dashes:
  # PRD s3.4 format rules: "no em dashes; no hyphens or dashes as punctuation". The em and en
  # dash are listed in config/output_spec.yaml document_rules.banned_characters. The scope and the
  # spaced-hyphen definition are D-24 proposals: authored prose only; verbatim quotes stay verbatim.
  scope: authored_prose
  characters: ["—", "–"]
  characters_source: "config/output_spec.yaml document_rules.banned_characters (PRD s3.4)"
  spaced_hyphen_is_punctuation: true
  spaced_hyphen_status: proposal

stale_phrases:
  source: "TODO, needs product owner: the PRD names the check, not the list; the legacy doc_checks.py was not supplied"
  phrases: []

excluded_names:
  source: "TODO, needs product owner: the PRD names the check, not the list; the legacy doc_checks.py was not supplied"
  names: []

abbreviations:
  # PRD s3.4: abbreviations written out on first use. The list is not given.
  source: "TODO, needs product owner: the list lived in the legacy scripts, not supplied"
  entries: []

partner_rule:
  # PRD s3.4: "For Salesforce partner clients, nothing is framed as a customer leaving
  # Salesforce or as a Salesforce failure." The two framings below are the rule's own words;
  # the full phrase list is TODO.
  framings: ["leaving Salesforce", "Salesforce failure"]
  framings_source: "PRD s3.4 research rules (the rule's own wording)"
  more_framings_source: "TODO, needs product owner: the legacy phrase list was not supplied"

quote_handling:
  # D-24 proposal: a restricted term inside a verbatim source quote withholds the sentence,
  # keeps the source link, counts and lists it. A quote is never altered.
  policy: withhold_and_count
  withheld_text: "Sentence withheld from this file by the distribution rules; the source link is kept."
  # what replaces a restricted term, a data tool's name or the word credits in the workspace's own
  # records (pull log, searches, detections): the member stays in the zip, scrubbed of the term
  record_marker: "[withheld]"
  status: proposal

limits:
  # Excel specifications and limits: total number of characters that a cell can contain is
  # 32,767 [VERIFY V-EXP-1]. Longer text continues on the "Long text" sheet, counted.
  excel_cell_chars: 32767
  excel_cell_chars_source: "Microsoft Excel specifications and limits [VERIFY V-EXP-1]"
  # Row caps fail the build (RowCapExceeded, B3); nothing is truncated. Proposal values.
  # sanity bounds on a file, not research caps (raised ten times 2026-10-24: an uncapped run on a
  # large account carries thousands of postings and people)
  row_caps: {summary_lane_rows: 50000, evidence_uses: 500000, people: 200000, postings: 500000, detections: 100000, sections: 5000, tracker_rows: 200}
  row_caps_status: proposal
  keyset_batch: 500
  keyset_batch_status: proposal
  authored_text_chars: 8000

renderer:
  # D-26: the Word renderer runs as a subprocess behind a JSON contract.
  timeout_s: 60
  max_output_bytes: 104857600
  max_stderr_bytes: 65536
  reruns: 1
  status: proposal

# Plain-English headings, in the document order of the owner's output specification (Madrid ABM
# master prompt v2, 2026-10-24: section 9.1 the Account Summary, 9.2 Sources and Evidence). The
# keys under ``summary`` are listed in the order the sections are rendered.
headings:
  source: "master prompt v2 (2026-10-24) sections 9.1 and 9.2; PRD s3.4; config/output_spec.yaml"
  # 2026-10-25: numbered and worded as the owner's skill-built reference Account Summary (the reference
  # file set the platform's output must match)
  summary:
    files: "Files in this set"
    how_to_read: "How to read this file"
    narrative: "1. The account in plain words"
    narrative_picture: "The account picture"
    stands_out: "What stands out"
    lane_meaning: "What it likely means for each lane (interpretation labeled)"
    caveats: "How this could be wrong"
    executive_voice: "What the executives said"
    news: "2. Recent news (newest first)"
    baseline: "3. Company and transformation baseline"
    signals: "4. Signals"
    signals_tier1: "Tier 1, budget proximate"
    signals_tier2: "Tier 2, one step removed"
    signals_tier3: "Tier 3, context and openers"
    signals_context: "Context and history (older than the shelf life)"
    lane_tables: "5. Platform picture by lane"
    # the window is the postings window of config/skill/scope.yaml, dated from the research date
    platform_hiring: "Platform hiring over {months} months ({account} positions only, first seen {start} to {end})"
    people: "6. People"
    people_method: "How the list was built"
    key_people: "Key people (priority A and the executives the lanes report to)"
    linkedin_findings: "Findings from profiles"
    status_changed: "People whose status changed"
    people_interpretation: "Interpretation"
    hypotheses: "7. Hypotheses to test"
    sensitive_cautions: "Cautions for sensitive findings"
    first_call_questions: "8. Questions for a first conversation"
    decision_changes: "The simplest way to sharpen it"
    coverage_tracker: "9. Research coverage tracker"
    tracker_waiting: "Decisions waiting on the account owner"
    tracker_pass1: "Pass 1, summary homework"
    tracker_pass2: "Pass 2, detailed homework"
    source_links: "10. Source links"
    # proposal D-24: facts the grading step stored without a lane
    unassigned_lane: "Findings not assigned to a lane"
    absence: "No evidence found (the search proof is in the coverage tracker)"
  evidence:
    sources: "Part A. Source register"
    job_descriptions: "Part B. Job posting extracts for postings read in full"
    careers_postings: "Part C. Postings read one by one, by lane"
    post_extracts: "Part D. Video, article and release extracts"
    board_captures: "Part E. Job board captures"
    leads: "Part F. Leads not verified, and items checked and dropped"
    keep_copies: "Part G. How to keep copies of the original pages"
    data_pulls: "Part H. Data pulls"
    urls: "Part I. Full URLs written out"
    # parts E and H sub-headings (reference Sources and Evidence file); {dates} is the capture
    # date or range of the live board postings
    live_postings: "Live postings captured on {dates} that name a lane platform"
    live_postings_undated: "Live postings captured on the careers board that name a lane platform"
    tech_detections: "Technology detections for lane platforms"
    platform_postings: "Postings naming each lane platform"
    entity_split: "Entity split of the postings in the Job Postings file"
    news_feed: "News feed events"
    teams: "Platform teams"

# Word table headers (content). Proportions are in the theme (word.tables, same order).
documents:
  source: "master prompt v2 (2026-10-24) sections 9.1 and 9.2 (named columns); Ref column, order and the rest: proposal D-24"
  tables:
    # the Summary's section 5 as the reference Summary prints it (Item, What we found, Grade,
    # Reasoning and sources), with the statement policy column the skill requires kept; the
    # client's on-screen Facts by grade table shows the same cells (views.rowsources.facts)
    platform_picture: ["Ref", "Item", "What we found", "Grade", "Use in outreach", "Reasoning and sources"]
    key_people: ["Ref", "Name", "Title as reported", "Lane", "Priority", "Link", "Note", "Source"]
    linkedin: ["Ref", "Person", "What the profiles show", "Their own words", "Source"]
    # kept in step with the theme's table list; the document and the client table print ``coverage``
    tracker: ["Ref", "Coverage row", "Status", "Priority", "Reason", "Tools", "Results"]
    coverage: ["Ref", "Source type", "Status", "Priority", "Needs", "What was done (proof)", "What remains"]
    waiting: ["Ref", "Source type", "Needs"]
    grade_legend: ["Grade", "Meaning", "Use in outreach"]
    recent_news: ["Ref", "Date", "What happened", "Read depth", "Source", "Why it matters"]
    # the baseline is a bulleted list ("Item: what (sources)."), as the reference Summary prints
    # it; the tier is the signal table's own subheading, so the rows carry no Tier column
    signals: ["Ref", "Finding", "Grade", "Lanes", "Date", "Sources"]
    status_changed: ["Ref", "Person", "Was", "Now", "Source"]
    source_links: ["Ref", "ID", "Source", "Domain"]
    platform_hiring: ["Ref", "Platform", "Postings naming it", "Open on {as_of}", "Build roles", "Admin and owner roles", "Working tool", "User role"]
    sources: ["Ref", "ID", "Source", "Type", "Date", "How retrieved", "What it supports"]
    job_reads: ["Ref", "Posting", "Platforms", "Class", "What the posting says", "Entity"]
    lane_reads: ["Ref", "Posting", "Class", "Status", "Classification reasoning"]
    board_captures: ["Ref", "What was counted", "Number", "Base"]
    live_postings: ["Ref", "Posting", "Platforms named", "Entity", "Read in full", "Class"]
    leads: ["Ref", "Lead", "Queries and checks tried", "Status", "Source"]
    data_pulls: ["Ref", "Pull", "Count", "Base"]
    tech_detections: ["Ref", "Technology", "First seen", "Last seen", "Postings naming it"]
    platform_postings: ["Ref", "Platform", "Postings", "Open", "Build", "Admin and owner", "Working tool", "User role"]
    entity_split: ["Ref", "Entity", "Postings"]
    # Part I (full URLs written out) is plain lines, one per code, as the reference prints it
  labels:
    sources_suffix: "Sources"
    question_prefix: "Confirming question"
    speaker_prefix: "Speaker"
    no_sentence: "No sentence relied on; cited as the link of a row."
    not_dated: "Not dated"
    verified: "Yes"
    feed_only: "Feed only"
    as_of: "As of"
    attribution_line: "Prepared by 6th agents"
    sensitive_heading: "Sensitive findings"
    # title block (9.1 item 1)
    research_by: "Research by 6th agents"
    domain_prefix: "Domain"
    version_prefix: "Version"
    config_prefix: "configuration"
    files_intro: "Evidence, postings and source extracts, the people list, the postings and the stack and teams are in the other files of this set:"
    # the Summary's title and opening paragraph as the reference Account Summary words them
    # (build_summary.js line 9); the legal name comes from the stored entity lock
    summary_title: "{account} ({legal_name}): {document}"
    summary_title_plain: "{account}: {document}"
    research_date: "Research date {date}."
    files_line: "Evidence, postings and source extracts are in {evidence}. People are in {people}, postings in {jobs}, stack and teams in {tech}."
    # Recent news "Read" column (9.1 item 4)
    # the skill's read depth words (output-spec.md: Read, Headline only, Feed only); a cached
    # copy and a finding with no read evidence keep their own words rather than claim a read
    read_full: "Read"
    read_headline: "Headline only"
    read_feed: "Feed only"
    read_cached: "Cached copy"
    read_not: "Not read this run"
    news_sentence: "The timeline covers {n} dated findings from the last {months} months; undated findings are listed in the signal tables."
    # How to read this file (output-spec.md "Grades"): the line above the legend and each grade's
    # meaning and use as the skill words them; a grade the policy forbids stating never reads
    # "May be stated" whatever this says (the mapper checks it against config/grading.yaml)
    legend_intro: "Every statement carries a source ID in brackets (S for a source). Every row in a table carries a grade:"
    grade_legend:
      confirmed: {meaning: "Read in a primary source during this run", use: "May be stated"}
      probable: {meaning: "Inferred from one or two sources, reasoning given in the row", use: "Ask, do not state"}
      hypothesis: {meaning: "Synthesis, no source states it", use: "Ask, do not state"}
      lead: {meaning: "Seen in a secondary source, not verified", use: "Do not use until checked"}
    caution_prefix: "Caution"
    # coverage tracker columns (9.1 item 11)
    # worded as the reference tracker (2026-10-20): "Not started", "None" left on a finished
    # row, one tally line over all rows, waiting rows as plain bullets
    needs_nothing: "Nothing"
    done_results: "Searched with {tools}: {n} results"
    done_zero: "Searched with {tools}; nothing found"
    done_uncounted: "Searched with {tools}; results not counted"
    done_nothing: "Not started"
    # a finished row (Done, Partial, None) with no search on record: never "Not started"
    done_unrecorded: "No search recorded"
    remains:
      "Done": "None"
      "Partial": "The rest of the row"
      "Not done": "The whole row"
      "Blocked": "The row, once the need is met"
      "None": "None"
      "Not yet reported": "The whole row"
    waiting_line: "{row}: {status} ({needs})."
    waiting_line_plain: "{row}: {status}."
    tally_line: "Tally, computed from the rows above ({n} rows): {counts}."
    source_links_note: "Job postings read are listed in Part C of the Sources and Evidence file and in the Job Postings workbook."
    # Sources and Evidence (9.2)
    # Part A "How retrieved", in the reference register's words (2026-10-20)
    retrieved_live: "Page read"
    retrieved_cached: "Cached copy read"
    retrieved_feed: "Feed only"
    retrieved_snippet: "Search excerpt"
    retrieved_link: "Cited as a link"
    # the Sources and Evidence opening line, as the reference file opens (the title uses the
    # Summary's summary_title words with the evidence file's own name)
    evidence_opening: "Research date {date}. Companion to {summary}. Every source ID cited in the Summary is listed here with its link. Research by 6th agents."
    # Part A "What it supports": a finding not graded Confirmed carries its grade before it, and
    # the sentence it rests on follows the label
    supports_quote: "Source text"
    # Part A "Type" when the link itself says what the page is (else the source kind)
    source_type_posting: "Job posting"
    source_type_site: "Company site"
    source_type_profile: "Public profile"
    source_type_post: "Public post"
    # Part B posting cell: "Title (open, first seen 2026-10-19)"
    posting_first_seen: "first seen {date}"
    # Part A "What it supports" for a posting's own link that no finding rests on
    posting_supports: "Job Postings workbook row {ref}: {title}, {cls}"
    # the line under the Part B heading (the reference's, with what this table holds)
    job_reads_intro: "Each posting below was opened and read in full. What the posting says gives the posting's own sentences that name a lane platform; the full description is in the Job Postings workbook. Entity shows whether the posting is a {account} position."
    post_type: "Post or comment"
    # Part D, one sub-heading per source read in depth: "<name> (<date>) (<code>)", the name being
    # the stored page title, else the publisher, else the host (never invented); a source the
    # Summary quotes an executive from reads "<name> (<date>), executive voice (<code>)"
    extract_voice: "executive voice"
    extract_posts: "Posts by people on the People List"
    supports_prefix: "Supports"
    queries_not_tried: "Not yet re-searched"
    keep_copies_text: "The workspace zip shipped with this delivery logs every data pull and lists every link cited; it does not hold copies of the pages. To keep a copy, open the link in the source register and save the page as a PDF with the date in the file name. For job postings, save the posting page the same day, because the careers site removes closed requisitions. Where a source or posting carries an Archived copy line, that link opens the saved page. Links that stop resolving should be replaced by the words Archive record in any later version, so the reader knows to use the saved copy."
    read_in_full_yes: "Yes"
    read_platform_sentence: "Platform sentence"
    read_title_only: "Title only"
    lead_queries:
      pending: "Re-search started; fewer than {queries} differently worded queries recorded so far"
      incomplete: "Re-searched; the rule of {queries} differently worded queries across {tools} tools was not met"
      complete: "Re-searched with {queries} or more differently worded queries across {tools} or more tools; not confirmed"
      upgraded: "Re-searched and confirmed"
    detections_intro: "First seen and last seen are the dates the technology name appeared in the account's public material (postings and web pages). A date range shows presence in public material, not adoption, evaluation or retirement. Postings naming it counts the postings of the Job Postings file that name the technology. Platforms outside the lanes are left out."
    news_feed_counted: "The news feed returned {events} events in {calls} pulls. The events are not stored with this file set, so they are not listed one by one; findings taken from the feed are in the source register, retrieved as {feed}."
    news_feed_uncounted: "The news feed was pulled {calls} times; the number of events returned was not recorded. Findings taken from the feed are in the source register, retrieved as {feed}."
    news_feed_none: "The news feed was not pulled for this run."
    # link texts (reference 2026-10-20): the Key people Link cell reads "Profile"; a source or
    # posting with a stored archived copy carries a second linked line; Part I writes every URL
    # out in plain text, the archived copy under it; the footer counts pages
    profile_link: "Profile"
    archived_copy: "Archived copy"
    url_line: "{code}: {url}"
    archived_line: "archived: {url}"
    page_label: "Page"
  status: proposal

# The statement policy wording printed beside each graded row (D-01 labels come from the grading
# engine's display_label; this is the column text). Proposal.
statement_text:
  may_state: "May be stated"
  ask: "Ask, do not state"
  status: proposal

none_found:
  # B3: an empty section renders an explicit note derived from the tracker proof, never a blank.
  text: "None found. The coverage tracker records what was searched and with what result."
  teams: "None recorded. No team data was stored for this run."
  source: "PRD s3.4 (None with proof); spec B3"

labels:
  # PRD s3.4 step 5 names the four posting classes; "Unclassified" is the job pipeline's own
  # value for anything not decided (src/jobs/counts.py). The two derived classes (a posting read
  # that names no lane platform; a posting not read in full) and the status words follow the
  # owner's master prompt v2 section 9.4 (2026-10-24).
  posting_class:
    build: "Build role"
    admin_owner: "Admin and owner role"
    working_tool: "Working tool"
    user: "User role"
    unclassified: "Unclassified"
    no_lane_platform: "No lane platform named"
    title_only: "Not read (title only)"
  # the classes that confirm a platform is used (master prompt v2 section 9.5 Summary table)
  posting_class_confirming: [build, admin_owner, working_tool]
  # Status is Open or Closed only, as the reference prints it (no third word). A posting whose
  # status the feed did not give counts as Open everywhere (the Summary matrix, the Platform
  # Ranking's "Open now", the Counts sheet, RESTORE.md, the Word tables) and prints "Open"; the
  # stored value stays "unknown" in the database (fix wave C, review 2026-10-29 finding 6)
  posting_status:
    open: "Open"
    closed: "Closed"
    unknown: "Open"
  # how a posting was read (master prompt v2 section 9.4 "Source"): the read type, not the code
  posting_source:
    live_board_read: "Live board, read"
    feed_read: "Job feed, 12 months, description read"
    feed_title_only: "Job feed, 12 months, title only"
  # a posting whose link is off the account's domains names its host and this suffix
  entity_to_confirm_suffix: " (entity to confirm)"
  # The Entity column. Per-account entity rules are DATA on the stored entity lock
  # (accounts.entity_lock, read into SnapshotContent.entity_lock): "entities" is a list of
  # {label, patterns (case sensitive regular expressions over the posting title and description),
  # before (ISO date; the rule applies only to a posting first seen before it), counts_as_account}
  # and "entity_prefix" optionally gives the account's short name (it must start the account name).
  # Rules are applied first, in order; then the host rule above. The Summary matrix counts the
  # rows whose Entity starts with the prefix (COUNTIFS "<prefix>*"), so counts_as_account is true
  # exactly when the label starts with the prefix (a subsidiary: "<prefix> (Name)"); a rule that
  # breaks this, has no pattern, an uncompilable pattern or a bad date is left out and listed in
  # the manifest as withheld block "jobs.entities" (src/exports/readers/jobs.py entity_rules).
  # people rubric level ids (config/people_rubric.yaml) to the spec's level labels (master prompt
  # v2 section 9.3); ids the rubric does not have yet (senior_director, team_lead) are mapped so a
  # rubric change needs no code change; anything else is "other"
  # wording as the owner's reference People List prints it (2026-10-19); associate_director
  # has no rubric level yet and is mapped so a rubric change needs no code change
  people_level:
    c_level: "C-level, EVP and SVP"
    evp: "C-level, EVP and SVP"
    svp: "C-level, EVP and SVP"
    vp: "VP"
    senior_director: "Senior Director"
    director: "Director"
    associate_director: "Associate Director"
    head: "Head"
    senior_manager: "Senior Manager"
    manager: "Manager"
    team_lead: "Manager"
    other: "Lead, owner, specialist or developer"
  # the level labels in table order (the Summary sheet's Level table, the reference's order)
  people_level_order: ["C-level, EVP and SVP", "VP", "Senior Director", "Director", "Associate Director", "Head", "Senior Manager", "Manager", "Lead, owner, specialist or developer"]
  # level ids that meet the seniority rule (Director and above, Head, Senior Manager)
  people_level_senior: [c_level, evp, svp, vp, senior_director, director, associate_director, head, senior_manager]
  # People List lane wording: the eight role-family lanes of the owner's reference People List
  # (config/people_rubric.yaml people_lanes; one lane per person). The order here is the Lane
  # table's order.
  people_lane:
    salesforce_commercial: "Salesforce and commercial"
    salesforce_integration: "Salesforce (MuleSoft and integration)"
    servicenow_shared: "ServiceNow and shared services"
    sap_erp: "SAP and ERP"
    veeva_life_sciences: "Veeva and life sciences systems"
    analytics_data_ai: "Analytics, data and AI"
    technology_it: "Technology, digital and IT leadership"
    business_other: "Business leadership and other"
  # a person stored before the role lanes existed has no role lane: the lane of the first platform
  # lane it has (people.models.Classification.lanes), else the default lane
  people_lane_default: business_other
  people_lane_platform:
    salesforce: salesforce_commercial
    servicenow: servicenow_shared
    sap: sap_erp
    tableau_analytics: analytics_data_ai
    data_ai: analytics_data_ai
    veeva: veeva_life_sciences
  # lane ids (config/job_lanes.yaml) to the spec's lane labels (master prompt v2 section 9.3);
  # used in every client file, so a never_report name in lanes.yaml never reaches a client
  lane:
    salesforce: "Salesforce and commercial systems"
    servicenow: "ServiceNow and IT service"
    sap: "ERP and business systems"
    tableau_analytics: "Analytics and Tableau"
    data_ai: "Data and AI"
    veeva: "Veeva and life sciences systems"
  # the Tech Stack and Teams workbook's own lane words (lane id to label): the Platform Ranking's
  # Lane column, as the reference prints it; a platform of no lane is ``lane_outside``
  tech_lane:
    salesforce: "Salesforce"
    servicenow: "ServiceNow"
    sap: "SAP"
    tableau_analytics: "Tableau and analytics"
    veeva: "Veeva"
    data_ai: "Data and AI"
  lane_none: "IT leadership and other"
  lane_outside: "Outside the lanes"
  # how a person was found, as the owner's reference People List prints it (Found by). Several
  # ways are joined with "; ". {pass_no} and {band} come from found_by_pass, {platforms} from
  # found_by_platform. A named person's page is a leadership page when its address has one of
  # found_by_leadership_words.
  found_by:
    title_search: "title search source {pass_no} ({band})"
    title_search_any: "title search"
    association: "technology association search ({platforms})"
    association_any: "technology association search"
    mention_leadership: "Leadership page; profile found by search"
    mention_other: "Research page; profile found by search"
  found_by_pass:
    1: "leadership and platform"
    2: "manager"
  # a stored title search whose titles contain one of these words is that pass (else pass 1)
  found_by_pass_terms:
    2: ["senior manager"]
  found_by_platform:
    salesforce: "Salesforce"
    servicenow: "ServiceNow"
    sap: "SAP"
    tableau_analytics: "Tableau"
    veeva: "Veeva"
    data_ai: "Data and AI"
  found_by_leadership_words: [leadership, management, executive, executives, team, board, officers, people]
  "yes": "Yes"
  "no": "No"
  not_pulled: "Not pulled"
  not_dated: "Not dated"
  teams_none: "None recorded"
  # sources.kind vocabulary (migration 0005); aggregator sources are labelled (PRD s3.4 gate)
  source_kind:
    primary: "Primary"
    secondary: "Secondary"
    aggregator: "Aggregator (labelled)"
  # PRD s3.4 step 6: "A date range in a detection feed is a lead, not a finding."
  detection_grade: "Lead (detection feed; a date range is not a finding)"
  source: "PRD s3.4 steps 5 and 6; stored vocabularies; master prompt v2 sections 9.3 to 9.5 (2026-10-24); wording: proposal D-24"

# Fixed sentences of the workbook Summary sheets (master prompt v2 sections 9.3 and 9.5).
sheet_texts:
  source: "master prompt v2 sections 9.3 and 9.5 (2026-10-24); wording where the prompt gives none: proposal"
  # People List Summary sheet, in the order and style of the owner's reference People List
  # (2026-10-19). Every count comes from the stored people record or the run's stored search
  # calls; {rows}, {searches}, {records} and {people} are a count with its word ("1 row").
  people:
    title: "{account} people list, deduplicated"
    what: "This is the single people list for the {account} account."
    merges: "It merges {parts}."
    # {searches} the stored title search calls ("2 title searches"), {passes} each pass with its
    # own counts: "leadership and platform titles, 976 records loaded, 61 people on this list"
    merge_title: "{searches} on the {domains} domain ({passes})"
    merge_title_any: "{searches} on the account's domains ({passes})"
    searches_unknown: "title searches"
    search_pass: "{label} titles, {details}"
    # {platforms} the platforms of the gap lanes the association search ran for
    merge_association: "a technology association search for the {platforms} gaps ({details})"
    merge_association_any: "technology association searches ({details})"
    merge_mention: "people named in research ({details})"
    # the record count each stored search call returned (the ledger's record_count)
    matches: "{records} loaded"
    on_list: "{people} on this list"
    dedupe: "Duplicates removed by profile link and by name. Pulled by {attribution} on {date}."
    removed: "Rows removed before this list: {items}."
    removed_none: "No rows were removed before this list."
    # keyed "status|reason" as the people module's Summary lines name them
    removed_items:
      "in scope|kept off this file by the distribution rules": "{rows} kept off this file by the distribution rules"
      "out of scope|not current": "{rows} whose current employer is not the account"
      "out of scope|below scope": "{rows} below the seniority rule whose titles name no platform or technology"
      "out of scope|outside geography": "{rows} outside the account's geography"
      "excluded|not a person name": "{rows} whose name is a title or a fragment, not a person"
      "excluded|tenant exclusion": "{rows} on the account owner's own exclusion list"
      "for review|employment unknown": "{rows} held for review (nothing shows current employment at the account)"
      "for review|level unknown": "{rows} held for review (the title names no level)"
      "for review|location unknown": "{rows} held for review (no location)"
      "for review|exclusion ambiguous": "{rows} held for review (the title names compliance or audit without IT)"
      "for review|priority unmatched": "{rows} held for review (no priority rule matched)"
      "no profile link yet|": "{rows} unresolved (no profile link yet)"
      "merged as duplicates|": "{rows} merged as duplicates"
    removed_other: "{rows} {status} ({reason})"
    withheld: "{rows} without a registered profile source"
    exclusions: "{reasons} people are excluded at the account owner's instruction ({rows}): {names}."
    # the rubric's title exclusion reasons (config/people_rubric.yaml exclusion_rules)
    exclusion_reasons:
      security: "security"
      it compliance: "IT compliance"
      it audit: "IT audit"
      privacy: "privacy"
    no_exclusions: "No one was excluded by title (security, IT compliance, IT audit or privacy)."
    seniority_prefix: "Seniority rule: "
    seniority_below: "People below that level are kept only when the title names a platform or technology, because they confirm what is in use."
    seniority_filter: "Filter Meets seniority rule to Yes for the target list."
    # {entities} the account's own entities from its entity lock; {account} its name
    entity_labels: "Entity labels: rows labelled {entities} are {account} entities and are kept. People of a business that {account} has sold or combined with another company may still show {account} as employer; check before outreach."
    entity_labels_none: "Entity labels: people of a business that {account} has sold or combined with another company may still show {account} as employer; check before outreach."
    judgment_note: "Titles are self reported on public profiles and are not verified. Level, lane and priority are our judgment from the title alone (A: owns or runs a lane platform, its data or its program, or is the executive the lane reports to; B: senior and relevant; C: senior but outside the lanes). Correct them in the People sheet and the counts below update. Former SI and consulting employers come from the full profiles and cover any point in a career."
    level_heading: "Level"
    senior_label: "Meets seniority rule"
    lane_heading: "Lane, senior people only"
    total_label: "Total"
    link_text: "Open profile"
  # Tech Stack and Teams, after the owner's reference file (Tech Stack and Teams workbook,
  # 2026-10-20; patterns, labels and wording measured 2026-10-29). Sheet 2 is the organisation's
  # tech stack as the lookup returns it (the reference's Confirmed stack); the technology
  # detections (leads) are no sheet of their own, the Evidence file lists them. Placeholders:
  # {account}, {base}, {postings}, {months}, {as_of}, {mask}, {shown}, {matching}, {since}.
  tech:
    title: "{account}: platforms seen in job postings, ranked A, B, C"
    base_line: "Postings in the last {months} months that name at least one platform (the base):"
    rank_rule: "How the rank is set. A: named in 15 percent or more of the base and in at least 5 postings. B: named in 5 percent or more of the base and in at least 3 postings. C: named in at least 2 postings. Platforms named in one posting are listed under Seen once."
    count_rule: "Each posting counts once per platform, however many times it names it. Open and closed postings both count. The window is by posting date, else first seen; a posting with no date counts."
    signal_rule: "A platform named in hiring is a signal of skills the account wants, not proof the platform runs in production. The column In confirmed stack shows whether the separate stack pull also shows it."
    research_by: "Research by 6th agents. Ranks are formulas on the counts, so a corrected count updates the rank."
    counts_heading: "Counts"
    seen_once_heading: "Seen once (not ranked)"
    seen_once_none: "None"
    rank_label: "Rank {rank}"
    stack_title: "{account}: technologies seen in use, by business function and category"
    stack_note: "Pulled by 6th agents on {as_of} from public job postings and team records. Postings naming it is the number of postings in which the technology was named as used. Out of scope platforms are masked and are not used in any finding."
    teams_title: "{account}: teams whose public records name a lane platform"
    teams_title_counted: "{account}: teams whose public records name a lane platform ({shown} largest of {matching} matching teams, by postings since {since})"
    teams_listed: "{teams} teams whose public records name a lane platform are listed on the {sheet} sheet of the Tech Stack and Teams workbook."
    teams_note: "Pulled by 6th agents. Team names are as the source records them (often a business unit or function rather than an IT team). Team technologies lists every technology the team's records name with its postings count. Team locations shows city and country with postings count."
  # Job Postings Summary sheet, after the owner's reference file (Summary, measured 2026-10-29),
  # written for any account. Placeholders: {account}, {prefix} (the entity prefix the matrix
  # counts: the account's short name), {months}, {start}, {end}, {as_of}, {suffix}. The class
  # paragraph names the four matrix classes (test); the platform paragraph names the matching
  # rules of config/job_lanes.yaml (test).
  jobs:
    title: "{account} platform job postings, last {months} months (first seen {start} to {end})"
    paragraphs:
      - "Every posting on the {account} careers site first seen in the last {months} months that names a platform, pulled by 6th agents from the structured job posting feed, plus the live postings found on the careers site on {as_of} that the feed did not yet hold. Open and closed postings are both included, and a posting with no date is kept. One row per posting; a reposted requisition appears once per posting. A posting first seen before the start date above stays in our records but is not listed here and is not counted."
      - "Entity: {prefix} means a {prefix} position. A divested business or a subsidiary that is tagged for this account shows its own label; a label that starts with {prefix} is counted with the {prefix} positions below, any other label is shown for completeness and left out of the counts. A posting on another website shows that site's name followed by {suffix}; check which business it belongs to before quoting it."
      - "Class: Build role means the platform is the job. Admin and owner role runs the platform, owns its data or governs it. Working tool means daily use. User role is everything else, including boilerplate and tool lists. Build and Admin and owner roles are confirmed by reading the whole posting; the other two come from the sentences that name the platform. A class decided by reading the whole posting is a graded finding in the Sources and Evidence file; a class decided by the keyword rule over those sentences is a class only, not a finding. The Counts sheet shows how many listed postings were classed each way."
      - "What the posting says (read) is filled for roles read in full that were confirmed as Build or Admin and owner. Platform sentences shows the exact sentences where each platform is named, grouped by platform. Full description is the complete posting. Requisition is the job ID the posting prints, blank when it prints none. Link opens the posting; Archived link opens our stored copy, because closed postings disappear from careers sites. New since last research marks postings first seen after the previous research. Ref and Source code tie each row to the source register."
      - "Platforms are matched in the posting text. SAP is matched as the capitalized word SAP, S/4HANA, Ariba, SuccessFactors or Concur. Salesforce includes SFDC and the Salesforce clouds. Veeva includes Vault, PromoMats, eTMF and CTMS. A posting that names several platforms is counted once for each."
    matrix_heading: "Platform (named anywhere), {prefix} positions only"
    total: "Total"
    open: "Open"
    closed: "Closed"
    rows_all: "Rows on the Jobs sheet (all entities)"
    rows_account: "Rows that are {prefix} positions"
    rows_other: "Rows that are other entities (a divested business or another website)"

evidence:
  # Facts whose attribute key starts with one of these prefixes are listed under "News items
  # verified at source" when their evidence was read in full at the source.
  news_attribute_prefixes: []
  news_source: "TODO, needs product owner: no news attribute family is defined in config/grading_policy.yaml"
  # Part A Type: a link on one of these hosts is a public profile (path starts with a profile
  # path) or a public post (a post path); the account's own domain and careers host are the
  # company site; a posting's link is a job posting. Anything else prints the source kind.
  profile_hosts: ["linkedin.com"]
  profile_paths: ["/in/", "/pub/"]
  post_paths: ["/posts/", "/feed/update/", "/pulse/"]
  # Part C: one heading per platform of workbooks.jobs.matrix_platforms that a posting names
  # ({platform}, {read}, {named}, {account}, {open}, {date}), a note when none was read in full,
  # and one closing note. Counts are the Job Postings workbook's rows.
  lane_read_heading: "{platform}: {read} postings read in full ({named} {account} postings name it, {open} open on {date})"
  lane_read_posting: "{title} ({posting_ref}, first seen {first_seen})"
  lane_read_none: "No posting naming this platform was read in full; every posting naming it is a row of the Job Postings workbook, with its class and platform sentences."
  lane_read_note: "The class of every other posting naming a lane platform is in the Class column of the Job Postings workbook, and the sentences it was read by are in the Platform sentences column."
  lane_read_source: "reference Sources and Evidence Part C (owner's skill session, 2026-10-19); wording of the notes: proposal"

# Workbook columns: key, header and kind (the kind gives width and format in the theme). The PRD
# names title, level, lane, priority, profile URL and source for people; class, platform
# sentence, full description and link for postings; first and last seen and the cross-check for
# detections. Ref, status, dates, platforms and the order are D-24 proposals.
workbooks:
  source: "master prompt v2 sections 9.3 to 9.5 (2026-10-24); PRD s3.4 deliverables; row keys and the rest: proposal D-24"
  people:
    sheet: "People"
    # the owner's reference People List: 13 columns in this order and with these widths (Link
    # texts "Open profile"), then Ref and Source, the product's own: Ref is the row key the row
    # conservation check and the Summary formulas count, Source ties the row to the source register
    columns:
      - {key: number, header: "No.", kind: count, width: 6}
      - {key: name, header: "Name", kind: text_short, width: 26}
      - {key: title, header: "Title as reported", kind: text_short, width: 56}
      - {key: level, header: "Level", kind: label, width: 22, wrap: true}
      - {key: meets_seniority, header: "Meets seniority rule", kind: label, width: 11, wrap: true}
      - {key: lanes, header: "Lane", kind: label, width: 30, wrap: true}
      - {key: priority, header: "Priority", kind: label, width: 9, align: center}
      - {key: former_employers, header: "Former SI and consulting employers (firm and years)", kind: text_short, width: 30}
      - {key: found_by, header: "Found by", kind: text_short, width: 30}
      - {key: profile_url, header: "LinkedIn", kind: url, width: 13, link_text: "Open profile", wrap: true}
      - {key: second_profile_url, header: "Second profile", kind: url, width: 13, link_text: "Open profile", wrap: true}
      - {key: location, header: "Location", kind: text_short, width: 24}
      - {key: note, header: "Note", kind: text_short, width: 50}
      - {key: ref, header: "Ref", kind: ref}
      - {key: source_code, header: "Source", kind: code}
    header_height_pt: 32
    freeze_columns: 2
    summary_paragraph_height_pt: 58
    summary_span: 6
    summary_label_width: 44
    summary_count_width: 12
    summary_sheet: "Summary"
  jobs:
    sheet: "Jobs"
    columns:
      # the reference file's 14 columns in its order and widths (Job Postings, measured
      # 2026-10-29), then the owner's two additions (2026-10-29: the archived copy of the posting
      # and the new-row flag), then the product-only Ref and Source code, which stay to the
      # right: Ref is the row-conservation key (the Counts sheet and the render checks count it)
      # and Source code ties the row to the source register
      - {key: requisition, header: "Requisition", kind: label, width: 12}
      - {key: title, header: "Title", kind: text_short, width: 44}
      - {key: platforms, header: "Platforms named", kind: label, width: 18}
      - {key: posting_class, header: "Class", kind: label, width: 20}
      - {key: status, header: "Status", kind: label, width: 9}
      - {key: first_seen_text, header: "First seen", kind: label, width: 11}
      - {key: last_seen_text, header: "Last seen", kind: label, width: 11}
      - {key: location, header: "Location", kind: text_short, width: 26}
      - {key: seniority, header: "Seniority", kind: label, width: 11}
      - {key: entity, header: "Entity", kind: text_short, width: 26, wrap: false}
      - {key: read_text, header: "What the posting says (read)", kind: text_long, width: 50}
      - {key: platform_sentence, header: "Platform sentences", kind: text_long, width: 70}
      - {key: description, header: "Full description", kind: text_long, width: 60}
      - {key: url, header: "Link", kind: url, width: 13, link_text: "Open posting"}
      - {key: archive_url, header: "Archived link", kind: url, width: 16, link_text: "Open archived copy"}
      - {key: new_flag, header: "New since last research", kind: label, width: 14}
      - {key: ref, header: "Ref", kind: ref}
      - {key: source_code, header: "Source code", kind: code}
    counts_sheet: "Counts"
    long_text_sheet: "Long text"
    # the platform rows of the Summary matrix, in the reference's order; the same order is the
    # fixed order of the Platforms named cell (the other platforms follow alphabetically)
    matrix_platforms: [Salesforce, MuleSoft, ServiceNow, SAP, Tableau, Veeva, Workday]
    # the Summary matrix has no "All rows" line any more (the row-count lines under it do that
    # job); the key stays because the Summary and Evidence readers skip a matrix row of this name
    matrix_all_rows: "All rows"
    # the matrix class columns (stored class ids, labels from labels.posting_class) and the
    # classes whose rows print the sentence the reading quoted
    matrix_classes: [build, admin_owner, working_tool, user]
    read_text_classes: [build, admin_owner]
    sentences_per_platform: 4
    sentence_chars: 3000
    summary_sheet: "Summary"
    # the reference Summary: notes merged A:H, column A 52 wide, B to H 18 wide
    summary_span: 8
    summary_label_width: 52
    summary_count_width: 18
    # "Job ID: R-557322", "Requisition ID 12345", "Req #A-1001": the label, then the ID (group 1),
    # which must hold a digit; a posting that prints no such label leaves the cell blank
    requisition_pattern: '(?i)(?:job\s*(?:requisition\s*)?id|requisition\s*(?:id|number|no\.?)|req\.?\s*(?:id|#))\s*[:#]?\s*([A-Z0-9][A-Z0-9_-]*?\d[A-Z0-9_-]*)'
  tech:
    # the second sheet: the organisation's tech stack (the reference's Confirmed stack), five
    # columns and no Ref column (the reference has none; the rows are keyed by their first three
    # cells). Widths and no wrapping as the reference sets them.
    sheet: "Confirmed stack"
    columns:
      - {key: business_function, header: "Business function", kind: label, width: 26}
      - {key: category, header: "Category", kind: label, width: 40}
      - {key: technology, header: "Technology", kind: label, width: 34}
      - {key: postings, header: "Postings naming it", kind: count, width: 18}
      - {key: lane, header: "Lane", kind: label, width: 26}
    # the Lane column: a platform word in the lower-cased technology name gives the label; several
    # words take the last one in this order (the reference's build script). Every key is a name of
    # config/platform_dictionary.yaml (test).
    stack_lanes:
      Salesforce: "Salesforce"
      MuleSoft: "Salesforce (MuleSoft)"
      ServiceNow: "ServiceNow"
      SAP: "SAP"
      Tableau: "Tableau and analytics"
      Veeva: "Veeva"
      Workday: "Outside the lanes (Workday)"
    teams_sheet: "Platform teams"
    # the reference's columns and widths; rows come from SnapshotContent.teams (no pipeline
    # stores teams yet: the provider operation is not specified), else the None recorded line
    teams_columns:
      - {key: team, header: "Team", kind: text_short, width: 40, wrap: true}
      - {key: lane_technologies, header: "Lane technologies named", kind: text_short, width: 30, wrap: true}
      - {key: postings, header: "Postings count", kind: count, width: 10, wrap: true}
      - {key: first_activity, header: "First activity", kind: label, width: 12, wrap: true}
      - {key: last_activity, header: "Last activity", kind: label, width: 12, wrap: true}
      - {key: technologies, header: "Team technologies (name, postings)", kind: text_long, width: 70, wrap: true}
      - {key: locations, header: "Team locations (place, postings)", kind: text_long, width: 50, wrap: true}
      - {key: job_functions, header: "Job functions", kind: text_long, width: 40, wrap: true}
    ranking_sheet: "Platform Ranking"
    ranking_columns:
      - {key: rank, header: "Rank", kind: label, width: 8}
      - {key: platform, header: "Platform", kind: text_short, width: 30, wrap: false}
      - {key: category, header: "Category", kind: label, width: 26}
      - {key: lane, header: "Lane", kind: label, width: 22}
      - {key: count, header: "Postings naming it", kind: count, width: 12}
      - {key: share, header: "Share of base", kind: percent, width: 10}
      - {key: open_now, header: "Open now", kind: count, width: 10}
      - {key: last_seen, header: "Last seen", kind: label, width: 12}
      - {key: in_stack, header: "In confirmed stack", kind: label, width: 14}
      - {key: read_checked, header: "Matches checked by reading", kind: label, width: 14}

# Workspace zip (D-25 proposal). The PRD lists build scripts and raw data with neutral names; the
# SaaS document says share graded facts and links, not raw exports; broker terms (D-10) are open.
workspace:
  decision: D-25
  status: proposal
  restore_text_source: "the owner's reference workspace (its file set, RESTORE.md, 2026-10-20): layout, restore steps, canonical query definitions and entity rules; the figures come from the run"
  # The folders under the root, in zip order, as the reference workspace names them.
  folders: [deliverables, data, build, notes]
  # RESTORE.md. Placeholders: {account}, {as_of}, {folder}, {what}, {files}, {platform}, {tech},
  # {jobs}, {people}, {sheet}, {column}, {start}, {count}, {open}, {base}, {ranks}, {rank},
  # {platforms}, {label}, {counts}, {file}, {value}, {yes}, {senior}, {listed}, {domains},
  # {careers}, {hosts}, {names}, {n}.
  restore:
    title: "# {account} workspace"
    intro: "Account research by 6th agents, research as of {as_of}. Only Confirmed findings may be stated to a prospect; every other grade is a question. Sensitive findings are preparation, never openers."
    layout_heading: "## Layout"
    folders:
      deliverables: "the five files of this delivery"
      data: "pulls as the run stored them and the text of the pages, news and job postings the research read"
      build: "the data each deliverable was rendered from and the source link map (the builder code is not shipped)"
      notes: "the pull log (every call, parameters, counts), pass 1 (internal history, neutral form) and the sense check (entity and gap review)"
    folder_line: "- {folder}/: {what}: {files}"
    manifest_line: "- MANIFEST.json: the SHA-256 hash of every member, this note included"
    releases_line: "releases/ ({n} text files, one per page, news item or job posting, with its title, link and date; the same copy the Archived link of a file opens on the website after sign in)"
    restore_heading: "## Restore"
    restore_steps:
      - "1. Unzip and check every member against MANIFEST.json."
      - "2. To rebuild the deliverables from this run, ask your 6th agents contact; the build is deterministic, so the same run gives the same files. build/ holds the data each file was rendered from."
      - "3. A later delivery adds a new archive; this one is never changed."
    queries_heading: "## Canonical query definitions (use these wording for any question against this workspace)"
    query_platform: "- \"Postings naming {platform}\": {tech}, sheet {sheet}, column {column}: the postings of {jobs} dated {start} to {as_of} (posting date, else first seen; an undated posting counts) whose title, description or platform sentences name {platform}. Answer on {as_of}: {count} ({open} open)."
    query_rank: "- \"Platform rank\": {tech}, sheet {sheet}, base {base} postings naming any platform in the dictionary. {ranks}"
    rank_part: "{rank}: {platforms}."
    rank_none: "No platform is ranked."
    query_class: "- \"{label}\": {jobs}, sheet {sheet}, {column} equals {label}: {counts}; every other platform 0."
    query_count: "- \"{label}\": {file}, {base}. Answer on {as_of}: {value}."
    query_senior: "- \"Senior people\": {people}, sheet {sheet}, {column} equals {yes}: {senior} of {listed}."
    query_zero: "- A strict query that returns zero is reported as zero, then the nearest relaxed set is shown and labeled."
    entity_heading: "## Entity rules applied"
    entity_none: "- No entity lock was recorded for this run; results were kept as returned."
    entity_domains: "- The account's own pages: {domains}{careers}. A page on another host counts only when its text names the account."
    entity_careers: "; careers boards {hosts}"
    entity_subsidiaries: "- Subsidiaries kept as the account: {names}."
    entity_lookalikes: "- Look-alike hosts blocked, their results dropped: {n} (listed in data/entity_lock.json)."
    out_of_scope: "- Platforms on the out-of-scope list are never on the ranking sheet and are masked in every file."
    window: "- Postings dated before {start} are outside the Platform Ranking base."
  raw_payloads:
    default: excluded
    neutral_name_copy_enabled: false
  # data/releases/ (owner request 2026-10-29, after the reference workspace's data/releases/): one
  # text file per archived page, news item and job posting. The archived copy a file links to
  # opens only behind the website's sign in, so a forwarded file or this zip would otherwise hold
  # no readable copy of a posting that has since closed. Newest captures first up to max_files;
  # each text up to max_chars; a copy a client-output rule refuses is left out and listed.
  releases:
    folder: data/releases
    max_files: 2000
    max_chars: 60000
    source: "6th agents"
    kinds: [posting, page, feed_item]
    slug_chars: 48
    extension: ".md"
  max_members: 2100
  max_member_bytes: 104857600
  max_total_bytes: 524288000
  entry_name_max: 120
  # The members built from stored run data (owner's master prompt v2 sections 2 and 9.6,
  # 2026-10-24; folders and names after the reference workspace), in zip order within their
  # folder. A zip missing one fails its check. Each is built only from rows the run stored; a
  # source with no rows says so in one line and never carries invented rows.
  required_members:
    - data/entity_lock.json
    - data/web_searches.json
    - data/techstack_detections.json
    - build/urls.json
    - notes/pull_log.md
    - notes/pass1.md
    - notes/sense_check.md
  entity_lock:
    none_recorded: "No entity lock recorded for this run."
  web_searches:
    dropped_entity: "No result came from a host that belongs to the account or names it."
    dropped_empty: "No results returned."
  sense_check:
    none_recorded: "No sense check recorded for this run."
    recorded: "Sense check recorded for this run. Findings raised: {findings}. Corrections proposed: {proposals}."
    conflicts_heading: "Findings the sense check marked Conflicting"
    conflict_line: "- {label}: {value} (graded {grade}; the sources disagree)"
    conflicts_none: "No finding is marked Conflicting."
  # The tracker rows that need the client's own mail, notes and files decide the line; the reason
  # codes are tracker reason codes (config/tracker_v1.yaml), compared by their client wording.
  pass1:
    row_keys: [prior_customer_status, connections_alumni]
    reason_codes: [no_internal_access]
    skipped: "pass 1 skipped: no internal access"
    read: "Internal history was read; its findings stay with the account owner and are not part of this package."
    unknown: "The tracker holds no pass 1 rows for this run."
  # pull_log.md: the tool role is what a tool does, never who sells it (a role word never names a
  # provider). The output file is the deliverable the operation's results feed.
  pull_log:
    title: "Pull log"
    intro: "One line per distinct call the run made to its research tools. Cost is in US dollars."
