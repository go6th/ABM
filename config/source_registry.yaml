# INTERNAL. Source registry (D-15, proposal). Tier by source domain and by provider code
# (never a vendor name), aggregator flag, and upstream lineage group.
# T1 for the run's own account domain and its verified careers host is derived from run input,
# not listed here. Every other entry needs the product owner: none are guessed from memory.
version: "2026-10-02.1"
status: proposal
decision: D-15

# Unlisted domains: lowest tier and flagged for review.
unlisted_domain: {tier: T4, is_aggregator: false, flag: unclassified_source}

# Account-derived primary hosts: one lineage group (the company is the single upstream).
account_primary: {tier: T1, lineage_group: account_primary, live_state: true}

# Primary sources the owner's skill reads as a matter of course (tools.md "Earnings calls and
# releases": results releases are on the investor site and as SEC exhibits; checklist step 4 and
# the earnings and filings rows). A filing is the company's own statement in a public register:
# first tier, its own lineage (the company), a dated document. The research graph scrapes these
# hosts live (full page read) so a figure read there can be Confirmed (2026-10-24).
domains:
  - {domain: sec.gov, tier: T1, is_aggregator: false, lineage_group: account_primary, live_state: false,
     source: "owner skill v1.11 tools.md (earnings calls and releases: SEC exhibits); checklist.md step 4"}
# Example shape (add real entries only with a source):
#   - {domain: example-news.com, tier: T3, is_aggregator: false, lineage_group: example-news,
#      live_state: false, source: "TODO, needs product owner"}

# Broker records (origin broker_record), keyed by provider code. Upstream lineage of broker
# datasets is not documented, so each is its own group with lineage_known: false.
provider_codes:
  p_signals: {tier: T2, is_aggregator: true, lineage_group: "provider:p_signals", lineage_known: false, source: "TODO, needs product owner"}
  p_org:     {tier: T2, is_aggregator: true, lineage_group: "provider:p_org", lineage_known: false, source: "TODO, needs product owner"}
  p_people:  {tier: T2, is_aggregator: true, lineage_group: "provider:p_people", lineage_known: false, source: "TODO, needs product owner"}
