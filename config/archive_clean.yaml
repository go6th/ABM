# Archive record cleaning and classification (src/account_intelligence/archive_clean.py).
# Rules only: nothing here calls a provider or a model. Edit a list, no code change needed.
version: "1.0.0"

# Lines that are page chrome on any site (matched case-insensitively against the whole line,
# after links are reduced to their text).
chrome_lines:
  - '^(skip to (main )?content|menu|search|sign in|log in|login|sign up|subscribe|subscribe now|share|follow us|home|back to top|read more|more|close|accept( all)?( cookies)?|reject all|cookie (settings|policy|preferences))$'
  - '^(english|deutsch|français|español|italiano|português|nederlands|日本語|中文|한국어|русский|العربية|polski|türkçe|svenska)( \(.*\))?$'
  - '^(facebook|twitter|x|linkedin|instagram|youtube|tiktok|reddit|whatsapp|telegram|pinterest|email|copy link|print|rss)$'
  - '(?i)\b(soc ?2|gdpr|iso ?27001|hipaa)\b.{0,40}\b(compliant|certified|type ii|badge)\b'
  - '(?i)^made by humans\b'
  - '(?i)^look first\b'
  - '(?i)^(©|copyright)\s'
  - '(?i)^(all rights reserved|terms( of (use|service))?|privacy( policy)?|cookie( policy)?|contact us|about us|careers|advertise|help( center)?|sitemap|accessibility|do not sell)\b.{0,30}$'
  - '(?i)^(related (news|articles|stories)|latest news|trending|most (read|popular)|you may also like|recommended( for you)?|more from|also read|newsletter|download the app|get the app)\b'
  - '(?i)^(top stories|markets|screeners|ideas|scripts|products|community|brokers|more)$'
  - '^\s*[|:\- ]+\s*$'

# Where the page body ends: the first line matching one of these (after the body has begun and
# holds at least 30 words) cuts the rest as footer.
footer_markers:
  - '(?i)^(related (news|articles|stories)|latest news|more (news|stories|from)|you may also like|recommended|trending|comments?( \(\d+\))?|leave a (reply|comment)|about (tradingview|the author)|newsletter|©|copyright|terms of (use|service)|privacy policy)\b'

# The line that opens a disclaimer (kept as its own field, not in the body).
disclaimer_markers:
  - '(?i)^(disclaimer|disclosure|important (notice|information))\b'
  - '(?i)\b(ai[- ]generated|generated by ai|may contain inaccuracies|not (investment|financial|legal) advice|for informational purposes only)\b'

# Headings whose paragraphs are commentary, not facts (kept under `analysis`).
analysis_headings:
  - '(?i)\b(ai analyst|analyst (view|take|commentary)|commentary|our take|why it matters|what it means|market (view|reaction)|investor (view|takeaways?))\b'

# Per-publisher chrome (host without www., exact or parent domain): extra lines to drop.
publishers:
  tradingview.com:
    chrome_lines:
      - '(?i)^(products|chart|screener|stock heatmap|pine script|news flow|economic calendar|earnings calendar|brokers|get started|help center|tradingview news|new)$'
      - '(?i)^(ai analyst|ask ai)$'
  finance.yahoo.com:
    chrome_lines: ['(?i)^(mail|news|finance|sports|sign in to (see|view)).{0,30}$']

# Host classes. Matching: the host equals the entry or ends with ".entry".
wires: [prnewswire.com, businesswire.com, globenewswire.com, accesswire.com, newswire.com, einpresswire.com]
aggregators: [tradingview.com, finance.yahoo.com, yahoo.com, msn.com, news.google.com, marketscreener.com, investing.com, benzinga.com, stocktwits.com, finviz.com, stocktitan.net, morningstar.com, zonebourse.com, tipranks.com, simplywall.st]
trade_press:
  - fiercehealthcare.com
  - fiercebiotech.com
  - healthcareitnews.com
  - modernhealthcare.com
  - medtechdive.com
  - massdevice.com
  - medicaldevice-network.com
  - techcrunch.com
  - zdnet.com
  - computerworld.com
  - cio.com
  - informationweek.com
  - siliconangle.com
  - reuters.com
  - bloomberg.com
  - wsj.com
  - ft.com
  - cnbc.com
  - forbes.com
  - fortune.com
  - businesswire.com.au
regulators: [sec.gov, edgar.sec.gov, companieshouse.gov.uk, sedar.com, sedarplus.ca, asic.gov.au, esma.europa.eu, fda.gov]
careers: [greenhouse.io, lever.co, myworkdayjobs.com, workable.com, smartrecruiters.com, icims.com, jobvite.com]
video: [youtube.com, youtu.be, vimeo.com, spotify.com, podcasts.apple.com, soundcloud.com]
community: [medium.com, substack.com, reddit.com, quora.com, stackoverflow.com, github.com, dev.to]
profiles: [linkedin.com, crunchbase.com, zoominfo.com, rocketreach.co]

# A body or title that says this is generated by a model.
ai_markers:
  - '(?i)\bai[- ]generated\b'
  - '(?i)\bgenerated by ai\b'
  - '(?i)\bai (analyst|summary|summarized|summarised)\b'
  - '(?i)\bsummari[sz]ed by ai\b'

# The wire a summary says it is based on, found in the page text.
wire_names:
  "PR Newswire": ['(?i)\bpr ?newswire\b']
  "Business Wire": ['(?i)\bbusiness ?wire\b']
  "GlobeNewswire": ['(?i)\bglobe ?newswire\b']
  "ACCESSWIRE": ['(?i)\baccess ?wire\b']

# Tags and lanes from words the page states (title and body). First match order is kept.
tags:
  "Leadership change": '(?i)\b(appoint(s|ed|ment)?|names?|named|promot(es|ed)|succeed(s|ed)?|retire(s|d|ment)?|steps? down|resign(s|ed)?)\b.{0,80}\b(chief|president|officer|vp|vice president|head|director|ceo|cfo|cio|cto|ciso|evp)\b'
  "IT leadership": '(?i)\b(chief information|chief digital|chief technology|chief data|chief ai|cio\b|cto\b|cdo\b|ciso\b|head of (it|technology|data|digital))'
  "AI / digital": '(?i)\b(artificial intelligence|\bai\b|machine learning|generative|digital transformation|automation|analytics)\b'
  "Acquisition": '(?i)\b(acquire[sd]?|acquisition|to buy|merger|merges?|takeover)\b'
  "Divestiture": '(?i)\b(divest(s|ed|iture)?|spin[- ]?off|sells? (its|the) .{0,40}business)\b'
  "Financial result": '(?i)\b(quarter(ly)? results|earnings|revenue (of|was|rose|fell)|net income|guidance|fiscal (year|quarter))\b'
  "Partnership": '(?i)\b(partner(s|ship|ed)? with|collaborat(es|ion)|alliance|joint venture)\b'
  "Product launch": '(?i)\b(launch(es|ed)?|introduc(es|ed)|unveil(s|ed)?|new (product|platform|solution))\b'
  "Regulatory action": '(?i)\b(fda (approv|clear)|recall|warning letter|consent decree|investigation|settlement|fine[sd]?)\b'
lanes:
  "Technology, digital and IT leadership": '(?i)\b(chief (information|digital|technology|data|ai|information security)|cio\b|cto\b|cdo\b|ciso\b|it leadership|digital transformation)'
  "Executive leadership": '(?i)\b(chief executive|ceo\b|cfo\b|coo\b|president|board of directors|chair(man|woman)?)\b'
  "Mergers and portfolio": '(?i)\b(acquir|acquisition|divest|merger|spin[- ]?off)'
  "Financial performance": '(?i)\b(earnings|quarterly results|revenue|guidance|fiscal)\b'
  "Products and partnerships": '(?i)\b(launch|partner|collaborat|alliance|new product)\b'

# Roles a person-change sentence may name (a name is accepted only when a role word follows).
role_words: [chief, president, officer, executive, vice, evp, svp, vp, director, head, chair, chairman, chairwoman, general manager, cio, cto, ceo, cfo, coo, cdo, ciso, cmo, chro, managing director, partner, treasurer, controller, secretary]
