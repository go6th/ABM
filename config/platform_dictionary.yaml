# The platform dictionary behind the Platform Ranking sheet of the Tech Stack and Teams workbook.
# Source: the owner's Madrid ABM master prompt v2 (2026-10-24) section 7.3 and its asset
# assets/platform_ranking.py. Each entry names a platform, its category, the research lane it
# belongs to (a lane id of config/job_lanes.yaml; empty means outside the lanes) and the
# case-insensitive regular expression that says a posting names it (`case_sensitive: true` keeps
# the case, for a short name that is also a word). A posting matches when the pattern matches its
# title, description and platform sentences together; a posting counts once per platform.
# The loader (exports.config.platform_dictionary) refuses a pattern that does not compile and any
# name that is on the never_report list of config/skill/scope.yaml: a never_report name in a
# posting is simply not a platform.
version: "2026-10-24.1"
status: sourced
source: "master prompt v2 section 7.3 (platform ranking); assets/platform_ranking.py"

platforms:
  - {name: Salesforce, category: CRM, lane: salesforce, pattern: 'salesforce|\bsfdc\b|sales cloud|service cloud|marketing cloud|health cloud|life sciences cloud|agentforce|\bcpq\b'}
  - {name: MuleSoft, category: Integration, lane: salesforce, pattern: 'mulesoft|anypoint'}
  - {name: Tableau, category: Analytics and BI, lane: tableau_analytics, pattern: 'tableau'}
  - {name: SAP, category: ERP, lane: sap, pattern: '\bSAP\b|s/4 ?hana|s4hana|\bariba\b|successfactors|\bconcur\b'}
