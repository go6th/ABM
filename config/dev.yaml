environment: dev
log_level: DEBUG
slice_seconds: 240
max_slices: 60
tenant_concurrency: 5
raw_payload_backend: local
raw_payload_root: local-db/raw-payloads
secrets_from_environment:
  - DATABASE_URL
  - MIGRATOR_DATABASE_URL
  - CHECKPOINT_DATABASE_URL
  - APP_RW_PASSWORD
  - JWKS_URL
  - JWT_AUDIENCE
  - JWT_ISSUER
