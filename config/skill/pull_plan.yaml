# Phase 1 pull plan: which step pulls each coverage row and through which route (G1, G5, G15).
# 2026-10-21: rows carry their own queries (the queries section below) built from the skill's
# phase1-pull.md steps 2, 10 and 11 and tools.md; the generic phrasings remain for rows without
# them and for a topic refresh. youtube searches the open web (its pages are read off-site; it
# used to search only the account's own site and so never reached a video).
# INTERNAL: routes name a `need` from config/routing.yaml, never a provider; the connector layer
# resolves the provider and records it as a provider_code.
#
# Coverage rows are the platform's 33 (config/checklist.yaml). The archive's checklist rows could
# not be compared (archive absent, C31). Query wording: the archive's tools.md "query patterns that
# worked" (guide S11) is TODO, so the phrasings are generic proposals built from the row label.
version: "1.1.0"
status: "adopted 2026-10-24 (web research rebuild: own_site reads, pipeline rows, newsroom queries)"

# own_site: true  the row's queries are also searched on the account's own site and the pages
#                 found there are read in full (a live scrape), so the company's own releases,
#                 investor pages and leadership page can make a fact Confirmed (G5: read in a
#                 primary source this run). Until 2026-10-24 no fact of a run was ever Confirmed:
#                 the open web searches rarely returned the company's own pages (audit 2026-10-24).
# pipeline: jobs  the three posting rows are read, classified and counted by the job pipeline
#                 (jobs.stage) after Phase 1, as the skill's step 6 does; the extractor does not
#                 read them (their feed text made noisy "count" facts and most of a run's reading
#                 calls: 121 on Tolmar, staging 2026-10-21).
# pipeline: tech  technology detections are written as dated rows by code (first seen, last seen,
#                 lane), never asked of the model: a date range is a lead by rule.
# pipeline: people  the senior people list is the people pipeline's (people.stage: searches,
#                 merge, level, lane, priority, exclusions, profiles and posts where a source
#                 exists), run after the reading step under the tenant's people data consent
#                 (G8); switched on 2026-10-24 at the owner's request.

phrasings:
  status: proposal
  value:
    - "{account} {topic}"
    - "\"{domain}\" {topic}"
    - "{account} {topic} {year}"

# step: pass1 | pass2 | people (guide S3). need: config/routing.yaml routes[].need.
# people: true marks a people pull (G8 consent). Profile and post rows search the open web for the
# account's people (profile_enrichment needs the p_people grid contract and profile URLs; 2026-10-12).
# internal_history: true marks the Pass 1 rows the
# skill searched in mail, call notes and Drive (guide S20); that part is off by default (D-98).
rows:
  prior_customer_status:        {step: pass1,  need: web_search, internal_history: true}
  connections_alumni:           {step: pass1,  need: web_search, internal_history: true}
  platform_vendor_account_team: {step: pass1,  need: web_search, own_site: true}
  key_contact_profiles_posts:   {step: pass1,  need: web_search, people: true}
  basic_fit_check:              {step: pass1,  need: web_search, own_site: true}
  company_news:                 {step: pass2,  need: structured_signals, own_site: true}
  earnings_filings:             {step: pass2,  need: web_search, own_site: true}
  leadership_changes:           {step: pass2,  need: structured_signals, own_site: true}
  job_board_by_lane:            {step: pass2,  need: scrape, pipeline: jobs}
  job_postings_read_classified: {step: pass2,  need: structured_signals, pipeline: jobs}
  job_postings_12_months:       {step: pass2,  need: structured_signals, pipeline: jobs}
  technology_detections:        {step: pass2,  need: structured_signals, pipeline: tech}
  people_by_platform:           {step: people, need: people_by_technology, people: true, pipeline: people}
  full_profiles_senior_people:  {step: people, need: web_search, people: true, pipeline: people}
  posts_priority_people:        {step: people, need: web_search, people: true, pipeline: people}
  executive_voice_earnings:     {step: pass2,  need: web_search, own_site: true}
  financial_baseline_verified:  {step: pass2,  need: web_search, own_site: true}
  vendor_customer_stories:      {step: pass2,  need: web_search}
  lead_verification:            {step: pass2,  need: page_read, own_site: true}
  customers_partners_matched:   {step: pass2,  need: web_search, own_site: true}
  executive_speaking:           {step: pass2,  need: web_search}
  podcasts:                     {step: pass2,  need: web_search}
  youtube:                      {step: pass2,  need: web_search}
  medium_substack:              {step: pass2,  need: web_search}
  review_sites:                 {step: pass2,  need: web_search}
  vendor_communities:           {step: pass2,  need: web_search}
  regulatory_quality_events:    {step: pass2,  need: web_search}
  financial_position_peers:     {step: pass2,  need: web_search}
  competitor_moves:             {step: pass2,  need: web_search}
  major_holders_activists:      {step: pass2,  need: web_search}
  events_sponsored:             {step: pass2,  need: web_search}
  employee_content_github:      {step: pass2,  need: web_search}
  research_papers:              {step: pass2,  need: web_search}

# Each row's own search queries, from the skill (references/phase1-pull.md steps 2, 10 and 11;
# references/tools.md: plain journalist nouns, vendor names for the lanes, person titles). At
# least three per row (G3). Fields: {account}, {domain}, {year}, {prev_year}. Feed rows (jobs,
# technology) are fetched by the account's domain and do not use a query; the news and leadership
# feeds are joined by own-site searches of the newsroom and leadership pages (phase1-pull.md step
# 2: the newsroom list read, releases of the last 18 months, the leadership page); people-step
# rows and internal-history rows are not searched on the open web.
queries:
  source: "config/skill/archive/references/phase1-pull.md, tools.md (owner's skill v1.11)"
  status: "adopted 2026-10-21 (web research audit)"
  value:
    company_news:
      - "{account} press release {year}"
      - "{account} announces"
      - "{account} news release {prev_year}"
    leadership_changes:
      - "{account} appoints OR names OR joins {year}"
      - "{account} leadership team executive officers"
      - "{account} chief officer appointed {prev_year}"
    # phase1-pull.md step 2.5: the lane vendor partnership search is mandatory, one query per
    # vendor, logged even when it returns nothing
    platform_vendor_account_team:
      - "{account} Salesforce partnership OR partner OR agreement"
      - "{account} MuleSoft partnership OR partner OR integration"
      - "{account} ServiceNow partnership OR partner OR agreement"
      - "{account} SAP partnership OR partner OR agreement"
      - "{account} Tableau partnership OR partner OR agreement"
      - "{account} Veeva partnership OR partner OR agreement"
      - "{account} Workday partnership OR partner OR agreement"
      - "{account} Microsoft Dynamics partnership OR agreement OR migration"
      - "{account} selects OR deploys OR modernizes platform {year}"
      - "{account} invests OR launches platform program {year}"
    key_contact_profiles_posts:
      - "{account} chief information officer OR CIO"
      - "{account} chief technology officer OR chief digital officer interview"
      - "{account} vice president technology OR head of IT OR enterprise applications"
    basic_fit_check:
      - "{account} company overview ownership leadership"
      - "{account} revenue employees headquarters"
      - "{account} news {prev_year} {year}"
    earnings_filings:
      - "{account} earnings call transcript {year}"
      - "{account} annual report OR 10-K {prev_year}"
      - "{account} quarterly results investor relations {year}"
    job_board_by_lane:
      - "{account} careers"
      - "{account} jobs Salesforce OR ServiceNow OR SAP OR Workday"
      - "{account} careers technology engineering data"
    executive_voice_earnings:
      - "{account} earnings call CEO technology investment {year}"
      - "{account} investor day digital transformation"
      - "{account} earnings call AI data platform {year}"
    financial_baseline_verified:
      - "{account} annual revenue {prev_year}"
      - "{account} financial results fiscal year {year}"
      - "{account} employees revenue growth"
    vendor_customer_stories:
      - "{account} Salesforce customer story"
      - "{account} ServiceNow OR SAP OR Workday customer story OR case study"
      - "{account} MuleSoft OR Tableau OR Veeva case study"
    lead_verification:
      - "{account} press release {year}"
      - "{account} newsroom"
      - "{account} announces {year}"
    customers_partners_matched:
      - "{account} partners partnership announcement {year}"
      - "{account} customers case study"
      - "{account} alliance OR collaboration {year}"
    executive_speaking:
      - "{account} keynote OR speaker {year}"
      - "{account} executive interview"
      - "{account} Dreamforce OR Knowledge OR HIMSS OR HLTH speaker {year}"
    podcasts:
      - "{account} podcast interview"
      - "{account} CIO OR CTO podcast"
      - "{account} executive podcast episode {year}"
    youtube:
      - "{account} youtube"
      - "{account} video keynote OR webinar"
      - "{account} youtube interview {year}"
    medium_substack:
      - "{account} medium.com"
      - "{account} substack"
      - "{account} engineering blog"
    review_sites:
      - "{account} G2 OR TrustRadius"
      - "{account} PeerSpot OR Gartner Peer Insights"
      - "{account} software reviews customers"
    vendor_communities:
      - "{account} Trailblazer Salesforce"
      - "{account} AppExchange"
      - "{account} ServiceNow community"
    regulatory_quality_events:
      - "{account} recall OR warning letter {year}"
      - "{account} regulatory fine OR settlement"
      - "{account} data breach OR incident {year}"
    financial_position_peers:
      - "{account} competitors market share"
      - "{account} peers revenue growth {year}"
      - "{account} industry ranking {year}"
    competitor_moves:
      - "{account} competitors {year}"
      - "{account} competitor acquisition {year}"
      - "{account} rival launches {year}"
    major_holders_activists:
      - "{account} activist investor"
      - "{account} major shareholders"
      - "{account} private equity OR acquisition"
    events_sponsored:
      - "{account} sponsor conference {year}"
      - "{account} exhibitor booth {year}"
      - "{account} event sponsorship"
    employee_content_github:
      - "{account} github"
      - "{account} engineering blog technology"
      - "{account} open source"
    research_papers:
      - "{account} research paper"
      - "{account} white paper"
      - "{account} study published {year}"
