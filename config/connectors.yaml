# Client history connectors (Phase 3 WS6, CN1 to CN4; D-65 proposal). The roadmap names the sources
# and says "narrowest scope, per-source consent, log every access; Drive restricted in code to the
# folders the client named". Everything below is a proposal: the scope strings, endpoints and
# limits are NOT verified against the providers' documentation ([VERIFY], docs/open-items.md) and
# no real OAuth app exists. Gmail and call notes stay off until the owner decides D-65.
version: "1.0.0"
status: proposal
source: "Roadmap Phase 3 connectors; D-08 (Grain first, then CRM and Drive); D-65 proposal"
connectors:
  google_drive:
    enabled: true
    family: drive
    provider: google
    scopes: ["https://www.googleapis.com/auth/drive.readonly"]   # [VERIFY] narrowest scope that can read admin-named folders
    authorize_endpoint: "https://accounts.google.com/o/oauth2/v2/auth"  # [VERIFY]
    token_endpoint: "https://oauth2.googleapis.com/token"
    revoke_endpoint: "https://oauth2.googleapis.com/revoke"
    grant_kinds: [drive_folder]
  salesforce:
    enabled: true
    scopes: ["api", "refresh_token"]                               # [VERIFY]; read-only is enforced in code (no write call exists)
    authorize_endpoint: "https://login.salesforce.com/services/oauth2/authorize"  # [VERIFY]
    grant_kinds: [crm_object, crm_field]
    objects: {Account: [Id, Name, Industry, Website], Opportunity: [Id, Name, StageName, CloseDate, AccountId]}
  hubspot:
    enabled: true
    scopes: ["crm.objects.companies.read", "crm.objects.deals.read"]   # [VERIFY]
    authorize_endpoint: "https://app.hubspot.com/oauth/authorize"     # [VERIFY]
    grant_kinds: [crm_object, crm_field]
    objects: {companies: [id, name, domain, industry], deals: [id, dealname, dealstage, closedate]}
  # Mail and drive (REPLICA_PROMPT, owner decision 2026-10-14, reverses D-65): per-user,
  # read-only. Each needs an OAuth app the owner registers (client id and secret); until then
  # the Mail and drive page says "Not available yet". Scopes and endpoints are the providers'
  # documented read-only ones, [VERIFY] against a real app before going live.
  gmail:
    enabled: true
    family: mail
    provider: google
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]     # [VERIFY]
    authorize_endpoint: "https://accounts.google.com/o/oauth2/v2/auth"
    token_endpoint: "https://oauth2.googleapis.com/token"
    revoke_endpoint: "https://oauth2.googleapis.com/revoke"
    grant_kinds: []
  outlook:
    enabled: true
    family: mail
    provider: microsoft
    scopes: ["offline_access", "https://graph.microsoft.com/Mail.Read"]   # [VERIFY]
    authorize_endpoint: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
    token_endpoint: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
    grant_kinds: []
  onedrive:
    enabled: true
    family: drive
    provider: microsoft
    scopes: ["offline_access", "https://graph.microsoft.com/Files.Read"]  # [VERIFY]
    authorize_endpoint: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
    token_endpoint: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
    grant_kinds: []
  sharepoint:
    enabled: true
    family: drive
    provider: microsoft
    scopes: ["offline_access", "https://graph.microsoft.com/Sites.Read.All"]   # [VERIFY]
    authorize_endpoint: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
    token_endpoint: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
    grant_kinds: []
  call_notes:
    enabled: false                                                 # D-65: source not chosen
    scopes: []
    authorize_endpoint: "https://invalid.example/not-configured"
    grant_kinds: []
limits:
  oauth_state_ttl_s: 600
  refresh_attempts: 3
  max_pages_per_pass: 50
  max_items_per_pass: 500
  max_bytes_per_item: 10485760
  max_ancestry_depth: 20
  max_folder_depth: 10
