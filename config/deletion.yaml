# Tenant deletion on request (SaaS 3.1 rule 8; Phase 3 WS1 and AD2): derived data, raw broker
# results and embeddings are removed and the client is sent a confirmation; the public cache is
# untouched; ledgers and the audit trail are never deleted. The operation is dry run first, needs
# a second person to approve, runs in bounded batches and is resumable.
#
# EVERY table that carries a tenant_id is in exactly one of the three lists below, each with its
# reason (tests/system/test_erasure_classification.py fails on a new table that is in none of
# them, on one in two, and on a stale name). That test is what keeps this file from drifting
# (leakage review 2026-10-30, F3).
#
# `erase` is ordered children first (foreign keys; a test checks the order against the database).
# The database refuses any table outside the same allow-list (erase_rows, migration 0093).
# `blocked` lists tenant data that an earlier invariant forbids deleting, or that needs a decision
# first; the dry run counts it and execution stops short with the reason (conflict C23 in
# docs/decisions/conflicts.md). `never` is data the repository or the law keeps, with the reason;
# it is checked against `erase`. Stored objects (the five delivered files, workspace zips, raw
# uploads, archived bodies) are deleted by prefix after the rows (`objects` below).
version: "2.0.0"
status: proposal
source: "SaaS 3.1 rule 8; batch size and order are proposals (TODO, needs product owner)"
batch_size: 500
max_batches_per_pass: 200
