blocked:
  sources: "rows are never deleted (stable source codes, trigger sources_guard_identity); C23"
  people: "tombstone erasure only, not exposed until counsel decides (D-06, D-23); C23"
  person_profiles: "tombstone erasure only (D-23); C23"
  person_posts: "tombstone erasure only (D-23); C23"
  person_sources: "tombstone erasure only (D-23); C23"
  raw_payload_objects: "stored objects (delivered files, workspace zips, raw uploads, archived bodies, payloads) are deleted by prefix after the rows when an object store is configured (tenancy.storage.object_prefixes); without one the dry run keeps this item blocked"
  accounts: "the account row (name, domain, careers address) is referenced by account_runs, sources and the tool-call ledger, which are never deleted; pseudonymising it is a counsel decision (leakage review 2026-10-30, F3). An account the user removed from the workspace (deleted_at, deleted_by, migration 0087) stays as a hidden row for the same reason"
  account_bundles: "the version record of an account's output parity bundle (payload key, file manifest, gate report); insert-only for the application, and it references accounts, which are blocked. The bundle document and the rendered files it names are objects under the tenant prefix and go with the stored objects; moving this table to erase needs the eraser granted DELETE and the erase_rows allow-list widened in a new migration (owner decision, docs/audit/2026-10-30-merge-and-migration-fix.md)"
  account_source_counters: "source codes are never reused, so the counter stays with the sources rows it numbers; C23"
  runs: "the run row is referenced by ledgers that are never deleted (tool_calls, wallet and credit entries, account_runs)"
  users: "the client directory (name, email) is referenced by audit and membership history; removing a person's data is the data-subject-request flow (dsar_requests), a counsel decision"
  memberships: "who held which role is audit history that the directory and the audit log refer to; see users"
  llm_calls: "a cost ledger row that also carries the model's output_json; the content can only be removed by a reviewed definer update, which needs the owner's decision (ledgers are never deleted)"
