  scrub:
    account_runs: [run_input, stop_detail]
    runs: [error]
    research_jobs: [goal, topic, failure_reason]
    tool_calls: [response, response_ref]
    llm_calls: [output_json]
  scrub_reasons:
    account_runs: 'run_input holds the research goal and stop_detail free text; the run header, its status, credits and pins stay (ledgers refer to the run)'
    runs: 'error text of a failed run; the header stays'
    research_jobs: "goal, topic and failure reason are the client's words; the row stays because credit_entries hangs on it by a cascading foreign key"
    tool_calls: 'response and response_ref hold provider answers about the account; emptied so the research cache can never adopt a payload that is gone; cost columns stay'
    llm_calls: "output_json is the model's answer about the account; emptied; tokens and cost stay"
  tombstone: [accounts]
  keep:
    wallet_ledger: "money ledger of the account's runs; kept for accounting law (the run id stays, the account is a tombstone)"
    tool_call_events: 'ledger events of paid calls; ids, costs and error classes, no content'
    run_cap_versions: "credit cap history of the account's runs; billing record"
    run_cap_events: "credit cap events of the account's runs; billing record"
    spend_limit_events: "spend limit history of the account's runs; billing record"
    spend_reports: "spend reports of the account's runs; billing record"
    tool_call_records: 'raw call records of the paid-call ledger: operation, argument hash, cost; no content'
    llm_call_attempts: 'model call attempts of the cost ledger: error class only'
    credit_entries: 'credit reservations and settlements; billing record (it hangs on research_jobs by a cascading foreign key, which is why research_jobs is scrubbed, never deleted)'
    balance_snapshots: 'provider balance snapshots taken at runs; billing record'
    unit_cost_rollups: 'cost rollups per run; billing record'
    ops_cost_rollups: 'cost rollups per run and account for Runs and spend; billing record'
    spend_defects: 'spend invariant findings per run; billing record'
    provider_leases: 'provider concurrency leases; ids and times only'
    provider_waiters: 'provider concurrency queue; ids and times only'
    run_leases: 'worker leases on runs; ids and times only'
    run_anomaly_events: 'anomaly detector findings; ids and types only'
    stuck_run_observations: 'sweeper observations; ids and states only'
    usefulness_events: 'usage analytics events (kind, subject id, time); no content; the account id stays pointing at the tombstone'
  tenant_level:
    connector_access_log: 'a connection to a mailbox or drive belongs to the user, not to an account; only the items filed under the account (connector_items) are erased'
    connector_grants: 'a connection to a mailbox or drive belongs to the user, not to an account; only the items filed under the account (connector_items) are erased'
    connector_quarantine: 'a connection to a mailbox or drive belongs to the user, not to an account; only the items filed under the account (connector_items) are erased'
    connector_oauth_states: 'a connection to a mailbox or drive belongs to the user, not to an account; only the items filed under the account (connector_items) are erased'
    connector_connections: 'a connection to a mailbox or drive belongs to the user, not to an account; only the items filed under the account (connector_items) are erased'
    digest_runs: 'per-user record; no account link'
    research_file_chunks: 'files uploaded to the workspace for a file-driven research carry no account column; they are not reachable from an account and are left to the tenant deletion or to the person who uploaded them'
    research_file_deletions: 'files uploaded to the workspace for a file-driven research carry no account column; they are not reachable from an account and are left to the tenant deletion or to the person who uploaded them'
    research_file_findings: 'files uploaded to the workspace for a file-driven research carry no account column; they are not reachable from an account and are left to the tenant deletion or to the person who uploaded them'
    research_file_model_calls: 'files uploaded to the workspace for a file-driven research carry no account column; they are not reachable from an account and are left to the tenant deletion or to the person who uploaded them'
    research_file_state: 'files uploaded to the workspace for a file-driven research carry no account column; they are not reachable from an account and are left to the tenant deletion or to the person who uploaded them'
    research_file_upload_parts: 'files uploaded to the workspace for a file-driven research carry no account column; they are not reachable from an account and are left to the tenant deletion or to the person who uploaded them'
    research_file_uploads: 'files uploaded to the workspace for a file-driven research carry no account column; they are not reachable from an account and are left to the tenant deletion or to the person who uploaded them'
