# Stored objects: deleted by prefix once the rows are gone (tenancy.storage.object_prefixes). The
# raw_payload_objects entry above is cleared by that step when the object store is configured.
objects:
  - "tenants/<tenant>/"
  - "<tenant>/"
  - "quarantine/tenants/<tenant>/"
  - "uploads/tenants/<tenant>/"
  - "quarantine/<tenant>/"

# Purging ONE account the user already deleted (migration 0096; python -m
# account_intelligence.ops.purge_account; docs/audit/2026-10-30-purge-deleted-account.md). The
# account row (accounts.deleted_at) only marks it; this section says what the purge does with every
# table that carries a tenant_id, so a test can prove nothing is left unclassified:
#   erase           the account's CLIENT CONTENT, ordered children first (foreign keys; a test checks
#                   the order against the database). The database function purge_deleted_account
#                   holds the same list as row predicates, and account_purger holds DELETE on
#                   exactly these tables.
#   scrub           rows a ledger needs to keep: the content columns are emptied, the row stays.
#   tombstone       the accounts row: it stays (foreign keys, ledgers) with every name, address and
#                   setting cleared and a unique `deleted-<8 hex>.invalid` domain.
#   keep            tables that point at the account or its runs but are money, audit or operational
#                   records: untouched, with the reason.
#   tenant_level    tables with no link to an account: untouched, with the reason.
# erase_exceptions are tables that the TENANT plan keeps (`never`) and the account purge erases.
account_purge:
  version: "1.0.0"
  erase_exceptions:
    tenant_rule_accounts: "which accounts a client rule applies to; ids only, no content; a rule must not keep pointing at an account that no longer exists"
  erase:
