# Telemetry contract: spans (D-56). Span names and the attributes each may carry. Attributes are
# identifiers, enums and counts only (O3); the run id is the trace id (O2), not an attribute.
version: "2026-10-06.1"
status: proposal
spans:
  run: {attributes: [graph_version, state, outcome, run_type], owner: workflow}
  stage: {attributes: [stage, attempt, outcome], owner: workflow}
  unit: {attributes: [unit_type, unit_key_hash, outcome, lease_wait_s, queue_wait_s], owner: parallel}
  connector.call: {attributes: [provider_code, operation, route, attempt, cost_usd, cost_source, outcome], owner: connectors}
  model.call: {attributes: [task_kind, tier, alias, provider_code, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_micros, cost_source, outcome, degraded, fallback, attempt], owner: llm}
  grading.batch: {attributes: [batch_size], owner: grading}
  export.file: {attributes: [kind, outcome, rows], owner: exports}
  api.request: {attributes: [route_class, code_class, request_id], owner: api}
  outbox.relay: {attributes: [delivered, failed, gave_up], owner: spend}
  slice: {attributes: [slice_no, outcome], owner: workflow}
