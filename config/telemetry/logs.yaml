# Telemetry contract: log fields (D-56). A JSON log line may carry only these keys; values are
# checked by shape too (O3). Prompts, document text, names, domains, URLs with queries, secrets and
# tokens never appear. Identifiers (tenant, account, run, unit) are allowed in logs and traces.
version: "2026-10-24.1"
status: proposal
# This file lists log FIELDS, not event names. Deprecation events, catalogued here so an alert
# or a log query can rely on the name:
#   workflow_v1.deprecated  WARNING, once per run at slice 0 when Workflow v1 runs (ADR-0135);
#                           fields graph_version, reason ("abm_agents_off")
fields: [event, level, service, trace_id, span_id, request_id, method, tenant_id, account_id, document_id, import_run_id, part, run_id, unit_key_hash, provider_code, operation, route, fell_back_from, attempt, outcome, usage_known, error_class, error_code, message_hash, where, http_status, latency_ms, bytes, pages, items_read, items_kept, stop_reason, cost_usd, charged_usd, credits, cost_source, possible_duplicate, replayed, retry_after_s, waited_s, stage, state, graph_version, task_kind, tier, alias, degraded, kind, shape, rows, count, graded, dropped, slo, severity, version, image_digest, client, phase, model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cache_write_1h_tokens, batch, slices, turns, reason, tools_called, predicates, row_count, relaxed_predicate, dedup_removed, empty_results, searches, web_searches, web_reads, run_python_used, pages_read, read_refusals, shortfall_refusals, code_sha256, matched_column_count, matched_value_count, tables_held, rows_held, batch_id, polls, listed, matched, logger, exits, short_text, read, withheld, caps_off]
max_value_chars: {value: 200, status: proposal}
