# Telemetry contract: log fields (D-56). A JSON log line may carry only these keys; values are
# checked by shape too (O3). Prompts, document text, names, domains, URLs with queries, secrets and
# tokens never appear. Identifiers (tenant, account, run, unit) are allowed in logs and traces.
version: "2026-10-06.1"
status: proposal
fields: [event, level, service, trace_id, span_id, request_id, tenant_id, account_id, run_id, unit_key_hash, provider_code, operation, route, fell_back_from, attempt, outcome, error_class, error_code, message_hash, http_status, latency_ms, bytes, pages, items_read, items_kept, stop_reason, cost_usd, charged_usd, credits, cost_source, possible_duplicate, replayed, retry_after_s, waited_s, stage, state, graph_version, task_kind, tier, alias, degraded, kind, rows, count, graded, dropped, slo, severity, version, image_digest]
max_value_chars: {value: 200, status: proposal}
