# Alert catalog (O14, D-60). Every alert names a catalog metric, a severity, an owner, a runbook,
# and a source or status; the simulator fires each on at least one scenario. Thresholds without a
# source are proposals.
version: "2026-10-06.1"
status: proposal
alerts:
  api_availability_fast_burn: {kind: burn, slo: api_availability, window: 1h, short: 5m, factor: 14.4, severity: page, owner: oncall, runbook: api-availability-burn.md, source: "ARCH"}
  api_availability_slow_burn: {kind: burn, slo: api_availability, window: 6h, short: 30m, factor: 6, severity: page, owner: oncall, runbook: api-availability-burn.md, source: "ARCH"}
  api_latency_p99: {kind: threshold, metric: api_latency_ms, above: 500, for_s: 600, severity: ticket, owner: api, runbook: api-latency.md, status: "proposal (form)"}
  isolation_canary_leak: {kind: any, metric: canary_hits_total, severity: page, owner: security, runbook: isolation-violation.md, source: "ARCH: any canary leak pages"}
  isolation_probe_leak: {kind: any, metric: isolation_probe_leaks_total, severity: page, owner: security, runbook: isolation-violation.md, source: "ARCH"}
  rls_denied_spike: {kind: rate_above, metric: rls_denied_total, above: 5, window_s: 300, severity: page, owner: security, runbook: isolation-violation.md, status: "proposal: threshold (ARCH says any spike)"}
  cache_ratio_low: {kind: ratio_below, metric: cache_read_ratio, below: 0.70, window_s: 3600, min_volume: 10000, severity: ticket, owner: llm, runbook: cache-ratio.md, source: "ARCH"}
  stuck_queued: {kind: threshold, metric: stuck_runs, state: QUEUED, above: 0, for_s: 300, severity: page, owner: oncall, runbook: stuck-runs.md, source: "ARCH: no run stuck beyond 5 minutes after recovery"}
  stuck_running: {kind: threshold, metric: stuck_runs, state: RUNNING, above: 0, for_s: 300, severity: page, owner: oncall, runbook: stuck-runs.md, status: proposal}
  telemetry_down: {kind: absent, metric: heartbeat, for_s: 600, severity: page, owner: oncall, runbook: telemetry-down.md, status: "proposal (D-60: silence is an alert)"}
  cost_drift: {kind: any, metric: cost_drift_total, severity: ticket, owner: finance-ops, runbook: cost-drift.md, status: proposal}
  unknown_cost: {kind: rate_above, metric: unknown_cost_calls_total, above: 0, window_s: 3600, severity: ticket, owner: finance-ops, runbook: cost-drift.md, status: proposal}
  provider_failures: {kind: rate_above, metric: connector_calls, outcome_not: [done, replayed, prepulled], above: 20, window_s: 900, severity: ticket, owner: connectors, runbook: provider-outage.md, status: proposal}
  model_degraded: {kind: rate_above, metric: llm_calls_total, degraded: "true", above: 20, window_s: 900, severity: ticket, owner: llm, runbook: model-outage.md, status: proposal}
  checkpoint_resume_failures: {kind: rate_above, metric: failures_total, failure_class: resume, above: 0, window_s: 3600, severity: ticket, owner: workflow, runbook: checkpoint-resume.md, status: proposal}
  sso_signin_refusals: {kind: rate_above, metric: auth_signin_refusals_total, above: 20, window_s: 900, severity: ticket, owner: identity, runbook: sso-outage.md, status: "proposal (Phase 3)"}
  connector_access_refused: {kind: rate_above, metric: connector_access_refused_total, above: 10, window_s: 900, severity: ticket, owner: connectors, runbook: connector-grant-broken.md, status: "proposal (Phase 3)"}
  tenant_suspended: {kind: any, metric: tenant_suspensions_total, severity: ticket, owner: support, runbook: tenant-suspended.md, status: "proposal (Phase 3)"}
  tenant_deletion_requested: {kind: any, metric: tenant_deletion_requests_total, severity: ticket, owner: support, runbook: deletion-request.md, status: "proposal (Phase 3)"}
  refresh_scheduler_stalled: {kind: absent, metric: refresh_scheduler_heartbeat, for_s: 1800, severity: page, owner: refresh, runbook: stuck-scheduler.md, status: "proposal (Phase 4)"}
  monitor_outage: {kind: rate_above, metric: monitor_polls_total, outcome: blocked, above: 20, window_s: 3600, severity: ticket, owner: signals, runbook: monitor-outage.md, status: "proposal (Phase 4)"}
  webhook_storm: {kind: rate_above, metric: webhook_receipts_total, above: 500, window_s: 300, severity: ticket, owner: signals, runbook: webhook-storm.md, status: "proposal (Phase 4)"}
  alert_flood: {kind: rate_above, metric: alert_deliveries_total, outcome: sent, above: 200, window_s: 3600, severity: ticket, owner: alerts, runbook: alert-flood.md, status: "proposal (Phase 4)"}
  alert_delivery_failed: {kind: rate_above, metric: alert_deliveries_total, outcome: failed, above: 0, window_s: 3600, severity: ticket, owner: alerts, runbook: slack-outage.md, status: "proposal (Phase 4)"}
  crm_write_failed: {kind: rate_above, metric: crm_writes_total, outcome: failed, above: 0, window_s: 3600, severity: ticket, owner: crm, runbook: crm-write-failed.md, status: "proposal (Phase 4)"}
  monitoring_budget_breach: {kind: any, metric: monitoring_budget_exhausted_total, severity: ticket, owner: governance, runbook: budget-breach.md, source: "roadmap: monthly monitoring budget with throttling"}
  telemetry_dropping: {kind: rate_above, metric: telemetry_dropped_total, above: 100, window_s: 600, severity: ticket, owner: oncall, runbook: telemetry-down.md, status: proposal}
