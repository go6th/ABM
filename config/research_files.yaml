# Research file parsers (2026-10-13). Unit sizes, archive guards and audit limits for the parsers
# that the uploaded-documents sandbox runs (documents.sandbox_child). INTERNAL. Every value is a
# proposal until measured on real files. Upload limits, leases and model use live in
# config/research_input_modes.yaml (documents).
version: "2026-10-14.1"
status: "proposal (limits unmeasured)"

parsing:
  rows_per_unit: 5000                # tabular rows per stored unit
  unit_text_bytes: 2097152           # 2 MiB of text per stored unit at most
  json_max_document_bytes: 67108864  # a JSON file that is not a top-level array is parsed whole up to this

archives:
  max_depth: 2
  max_members: 2000
  max_total_uncompressed_bytes: 21474836480   # 20 GiB
  max_ratio: 200                     # uncompressed / compressed per member (zip bomb guard)

audit:
  max_findings_per_check: 50         # example locations kept per check; the count is exact
