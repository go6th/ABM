# Automatic Model Routing and Pricing Configuration
# Strictly enforced by the backend model router. Callers cannot override model selection.
version: "2026-10-09.1"

# Hard allowlist of approved models
allowlist:
  - claude-opus-5-5
  - claude-fable-5-1

models:
  claude-opus-5-5:
    provider: anthropic
    display_name: "Claude Opus 5.5"
    responsibility: "Data collection and judgment calls"
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input_usd_per_million: 4.00
      cached_read_usd_per_million: 0.20
      cache_write_usd_per_million: 5.00
      output_usd_per_million: 20.00

  claude-fable-5-1:
    provider: anthropic
    display_name: "Claude Fable 5.1"
    responsibility: "Prediction, analysis, and follow-up chat"
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input_usd_per_million: 10.00
      cached_read_usd_per_million: 0.25
      cache_write_usd_per_million: 12.50
      output_usd_per_million: 50.00

# Pipeline Phase Routing
routing:
  phase_1_collection:
    model: claude-opus-5-5
    description: "Data collection, approved sources, boundary judgment calls, lane discovery, job matching"
    gcs_raw_layout: "tenants/{tenant}/runs/{run_id}/raw/"
    turn_limit: 30
    spend_limit_usd: 5.00
    allow_analysis_tasks: false
    retry_policy:
      max_retries: 1
      fallback_to_other_model: false
      hold_on_failure: true

  phase_2_analysis:
    model: claude-fable-5-1
    description: "Prediction, sense checks, explanations, Word and Excel deliverables"
    fresh_session: true
    allow_collection_tools: false
    read_only_raw_artifacts: true
    turn_limit: 20
    spend_limit_usd: 5.00
    retry_policy:
      max_retries: 1
      fallback_to_other_model: false
      hold_on_failure: true

  phase_3_quality_checks:
    validator: "runtime_quality_checks"
    hold_on_failure: true
    checks:
      - source_traceability
      - unsupported_or_missing_source_references
      - prohibited_tool_or_vendor_names
      - cross_tenant_content_isolation
      - required_output_deliverables
      - artifact_structural_integrity

  follow_up_chat:
    model: claude-fable-5-1
    description: "Follow-up questions regarding completed account runs"
    allow_new_collection: false
    read_only_saved_artifacts: true
    turn_limit: 20
    spend_limit_usd: 2.00
