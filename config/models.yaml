# Model routing and pricing: the ONLY file that holds model ids and prices (ADR-0113, ADR-0115).
# A task kind's tier comes from the routing table src/llm/route.py; the tier's task (below)
# routes through the active arm to a profile, the profile names the model. Prices live in
# `models.<id>.pricing` only (llm.cost); config/chat_models.yaml references these ids and holds
# no price (test_single_price_table). Callers cannot override model selection.
version: "2026-11-03.1"

# Hard allowlist of approved models
allowlist:
  - claude-opus-5-5
  - claude-fable-5-1
  - claude-sonnet-5-5
  - claude-haiku-5-5
  - kimi-k3
  - grok-4.5

tasks:
  - pull_planning
  - extraction
  - classification
  - synthesis
  - narrative
  - verification

# A profile names a provider and model; its prices are the model's (`models` below).
profiles:
  collection_opus:
    provider: anthropic
    model: claude-opus-5-5
  analysis_fable:
    provider: anthropic
    model: claude-fable-5-1
  extraction_sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
  # on the allowlist for the Ask route classifier (`helpers`); no research task routes here until
  # a Haiku 5.5 eval on the synthetic tabular workspace passes (token review item 9)
  helper_haiku:
    provider: anthropic
    model: claude-haiku-5-5

arms:
  automatic:
    description: >-
      Opus 5.5 plans, extracts, classifies and writes the Summary (sense check and distill run on
      the planner tier, ADR-0116); Fable 5.1 serves synthesis, narrative and the judge (the judge
      must differ from the extractor, G12)
    routes:
      pull_planning: collection_opus
      extraction: collection_opus
      classification: collection_opus
      synthesis: analysis_fable
      narrative: analysis_fable
      verification: analysis_fable
  cost_saving:
    description: >-
      Token-saving routing (2026-10-13): extraction and classification, whose output is validated
      in code against quoted evidence, run on Sonnet 5.5 at half the Opus price; planning and
      verification on Opus 5.5 (the judge must differ from the extractor); synthesis and narrative
      stay on Fable 5.1 (the voice of the deliverable). Switch active_arm back to "automatic" to
      restore the previous routing.
    routes:
      pull_planning: collection_opus
      extraction: extraction_sonnet
      classification: extraction_sonnet
      synthesis: analysis_fable
      narrative: analysis_fable
      verification: collection_opus

# The owner's split (2026-10-14): Opus 5.5 plans, pulls, extracts and classifies, Fable 5.1
# synthesises, narrates and judges (the judge must differ from the extractor). The token review's
# cost_saving arm (extraction on Sonnet 5.5) was tried on 2026-10-20 and reverted the same day by
# the owner. Extraction and classification run at their task_settings effort (low) whatever
# effort a user picks (ADR-0114). The arm serves every tier whose run keeps the default model of
# its role (workflow.deps.RunDeps.chosen_model); a model the user picks still serves its tiers.
active_arm: automatic
decision_status: Decided

# G11 (split mode): the extraction agents (extractor tier) and the analysis agents (sense check
# and distill, planner tier) run on different models, unless this block declares, with the ADR
# that decided it, that they share one. The active arm puts both on Opus 5.5 on purpose
# (ADR-0116), so the declaration is here; without it platform.llm.load_routes refuses to start
# (llm.route.split_mode_problem: a silent equality fails). Remove the block when the two tiers
# route to different models.
g11_shared_model:
  tiers: [extractor, planner]
  adr: docs/decisions/ADR-0117-g11-shared-model-declared.md

# Per-task request knobs for the Messages call (verified against anthropic 1.11.0, 2026-10-13:
# ``messages.create`` accepts ``output_config`` and a system block with ``cache_control``).
# effort: thinking depth; these models always think and thinking tokens count against max_tokens,
# so routine tasks run low and the deliverable writers run high. prompt_cache: the system prompt
# (the agent prompt plus its JSON schema, identical across calls of a task) is sent as a cached
# block, so repeated calls within the cache window pay the cached-read price for it.
# cache_ttl: "5m" (default, write 1.25x input) or "1h" (write 2x input); a batched call always
# uses "1h" because batches finish minutes apart. synthesis and narrative went from high to medium
# (token review item 14, 2026-10-20: thinking is billed as output at the Fable rate); compare one
# account's deliverables before raising them again.
task_settings:
  pull_planning:   {effort: medium, prompt_cache: true}
  extraction:      {effort: low,    prompt_cache: true}
  classification:  {effort: low,    prompt_cache: true}
  synthesis:       {effort: medium, prompt_cache: true}
  narrative:       {effort: medium, prompt_cache: true}
  verification:    {effort: low,    prompt_cache: true}

# Message Batches (token review item 8, 2026-10-20): research calls are not interactive, so the
# listed task kinds go through the Batches API at 50% of the standard price (the discount stacks
# with prompt caching). The batch id is kept per request in the run's payloads: a slice that ends
# while a batch runs leaves it running and the next slice collects the reply (never paid twice).
# A batch still unfinished `max_wait_seconds` after its first submission is cancelled (an
# unprocessed request is not billed) and the call is made at the standard price. Kimi K3 and
# Claude on Vertex have no batches: their calls stay standard.
batch:
  enabled: true
  # Speed policy (2026-10-27, owner: research must answer as fast as Claude does). `fast` sends
  # every call as a standard request, which answers in seconds; `economy` batches the task_kinds
  # below at half the price, and a batch answers in minutes (staging, 14 days: 634 batches, median
  # 3 min, 95th percentile 5 to 9 min, longest 34 min; the judge's 130-token verdicts waited a
  # median 137 s each). `fast` roughly doubles the model cost of the calls that were batched.
  # RESEARCH_SPEED=economy|fast in the service environment overrides this without a config edit.
  mode: fast
  # never batched in either mode: short answers a run waits on one at a time, where the discount
  # is cents and the wait is minutes
  interactive_kinds:
    - second_pass_posting
    - classify_posting
    - classify_person
    - source_reread
    - abm_sense_check
  # one retrieve call per waiting batch each interval: 32 calls in flight at 45 s is ~43 requests
  # a minute, under the lowest batch request limit (EXTRACT_CONCURRENCY in agents/graph.py)
  poll_seconds: 45
  max_wait_seconds: 1800
  task_kinds:
    - plan_gaps
    - extract_facts
    - classify_posting
    - second_pass_posting
    - classify_person
    - lead_queries
    # support_judge is not listed: the grading step asks the judge one short question at a time
    # (about 170 tokens in, 100 out) and waits for each answer before the next, so a batch per
    # question put minutes to half an hour of batch latency in front of every verdict. On
    # 2026-10-26 one staging research spent 20 hours in that loop (most judge batches ran past
    # max_wait_seconds, were cancelled and re-asked as standard calls at 2 s each) for a discount
    # of cents. Standard calls keep the judge at seconds per verdict.
    - source_reread
    - file_extract_facts
    - abm_setup
    - abm_pass1_extract
    - abm_pass2_extract
    - abm_people_extract
    - abm_sense_check
    - abm_distill

# Prompt-cache warm gate (platform/prompt_cache.py, 2026-10-21): research calls that share a
# cached prefix and arrive together let one call warm it (streamed; the rest go at its first
# event and read it) instead of each writing it. A batched call waits `coalesce_seconds` for
# siblings; alone it keeps its batch, with siblings one call goes standard and leads. A waiting
# call goes anyway after `max_wait_seconds`. `enabled: false` sends every call as before.
prompt_cache_gate:
  enabled: true
  coalesce_seconds: 0.25
  max_wait_seconds: 120

# The conversational surfaces' model and effort (owner decision 2026-10-17: every surface reads
# one layer; the research, Ask and eval surfaces all run on Kimi K3, Claude Fable 5.1 or Claude
# Opus 5.5 — switching is config here, never code). `chat`: Ask answers and follow-up chat; the
# model is the conversation's analysis model (the choices block below), so only effort lives
# here. `eval`: the live tabular eval suite (tests/evals/test_tabular_live.py); its model
# must be one of the choices models, overridable per run with EVAL_MODEL / EVAL_EFFORT.
# Ask and chat run at medium effort (token review item 4, 2026-10-20: was high; thinking is
# billed as output).
# Ask models that get the reading procedure (replica.model_answer.PROCEDURE_RULES, 2026-11-02): the
# fixed order of a table answer (read, query, count from the result, list every row, state
# coverage) written out, because Sonnet and Haiku skipped steps that Fable takes unprompted
# (staging 2026-11-01: a tabular turn answered with no tool call). Fable and Opus do not need it.
ask_procedure_models: [claude-sonnet-5-5, claude-haiku-5-5]
# The models whose earlier Ask answers are shown to the ask_procedure_models as worked examples
# (replica.exemplars): for a question like one Fable already answered for the same user, the
# earlier answer's shape (columns, row count, numbers, note) goes in the prompt.
reference_answer_models: [claude-fable-5-1]
# How each model runs in Ask (Sonnet deep-thinking plan, 2026-11-03, owner approved "Sonnet
# high, think deeply"): `min_effort` is the lowest effort an Ask turn on the model runs at (the
# composer's chip can ask for more, never less); `tool_rounds` is how many tool rounds one answer
# may use before its final answer (deeper reading needs more; the chat service's default is 6);
# `thinking_display: summarized` returns a readable summary of the model's reasoning, which the
# answer carries under "How this was worked out" after the same client-output scrub as the
# answer itself. Display changes what comes back, never how much the model thinks or the bill.
# A model not listed keeps the chip's effort, 6 rounds and no summary.
ask_model_settings:
  claude-sonnet-5-5: {min_effort: high, tool_rounds: 10, thinking_display: summarized}
  claude-fable-5-1: {tool_rounds: 10, thinking_display: summarized}
  claude-opus-5-5: {tool_rounds: 10, thinking_display: summarized}
  claude-haiku-5-5: {thinking_display: summarized}

surfaces:
  chat: {model: null, effort: medium}
  eval: {model: kimi-k3, effort: high}

# Rule R8 of the deleted model Router, rebuilt on the live model path (ADR-0133): a request that
# carries tenant or private data goes only to a model whose data_classes_allowed lists that class
# (only a model with VERIFIED zero data retention may list tenant or private). "off" (default):
# nothing changes; "warn": log model.data_class_violation and make the call; "enforce": refuse it
# before any paid call (the run ends PARTIAL model_data_class_refused). Quote the value: a bare
# off is read as false. A run on uploaded files (input_mode file) sends tenant data.
data_class_guard: "off"

models:
  claude-opus-5-5:
    provider: anthropic
    data_classes_allowed: [public_web]  # zero retention not verified (ADR-0133)
    # the shortest prefix the API caches (prompt caching docs, read 2026-10-21)
    min_cache_tokens: 512
    display_name: "Claude Opus 5.5"
    responsibility: "Planning, collection, extraction and the Summary (sense check, distill)"
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input_usd_per_million: 4.00
      cached_read_usd_per_million: 0.20
      cache_write_usd_per_million: 5.00
      output_usd_per_million: 20.00

  claude-fable-5-1:
    provider: anthropic
    data_classes_allowed: [public_web]  # zero retention not verified (ADR-0133)
    # the shortest prefix the API caches (prompt caching docs, read 2026-10-21)
    min_cache_tokens: 512
    display_name: "Claude Fable 5.1"
    responsibility: "Synthesis, narrative and the judge; a user's choice for Ask and chat"
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input_usd_per_million: 10.00
      cached_read_usd_per_million: 0.25
      cache_write_usd_per_million: 12.50
      output_usd_per_million: 50.00

  kimi-k3:
    provider: moonshot
    data_classes_allowed: [public_web]  # zero retention not verified (ADR-0133)
    display_name: "Kimi K3"
    responsibility: "A user's choice for research or analysis (owner decision 2026-10-14)"
    # platform.kimi.ai/docs/pricing/chat, read 2026-10-14 (cache write at the default 5 min TTL)
    context_window: 1048576
    max_output_tokens: 1048576
    pricing:
      input_usd_per_million: 3.00
      cached_read_usd_per_million: 0.30
      cache_write_usd_per_million: 3.00
      output_usd_per_million: 15.00

  claude-sonnet-5-5:
    provider: anthropic
    data_classes_allowed: [public_web]  # zero retention not verified (ADR-0133)
    # the shortest prefix the API caches (prompt caching docs, read 2026-10-21)
    min_cache_tokens: 512
    display_name: "Claude Sonnet 5.5"
    responsibility: "Extraction and classification of stored source text (output validated in code)"
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input_usd_per_million: 2.00
      # 0.05x input on Sonnet 5.5 (prompt caching pricing, read 2026-10-21; was 0.20)
      cached_read_usd_per_million: 0.10
      cache_write_usd_per_million: 2.50
      output_usd_per_million: 10.00

  claude-haiku-5-5:
    provider: anthropic
    data_classes_allowed: [public_web]  # zero retention not verified (ADR-0133)
    # the shortest prefix the API caches (prompt caching docs, read 2026-10-21)
    min_cache_tokens: 512
    display_name: "Claude Haiku 5.5"
    responsibility: "Ask route classification; a user's choice for research or analysis"
    context_window: 1000000
    max_output_tokens: 128000
    # prompts up to 100k tokens; above that $0.50 in and $2.50 out (the classifier sends < 1k)
    pricing:
      input_usd_per_million: 0.10
      cached_read_usd_per_million: 0.01
      cache_write_usd_per_million: 0.125
      output_usd_per_million: 0.50

  grok-4.5:
    provider: xai
    data_classes_allowed: [public_web]  # zero retention not verified (ADR-0133)
    display_name: "Grok 4.5"
    responsibility: "A user's choice for research or analysis (owner decision 2026-10-20)"
    # docs.x.ai/docs/models, read 2026-10-20: prompts under 200k tokens; a request whose prompt
    # reaches 200k is billed $4.00 in, $0.60 cached, $12.00 out for all its tokens. xAI bills no
    # cache write (repeated prefixes are cached automatically) and has no batch API. Reasoning
    # tokens are billed at the output price (the adapter counts them as output).
    context_window: 500000
    max_output_tokens: 128000
    pricing:
      input_usd_per_million: 2.00
      cached_read_usd_per_million: 0.30
      cache_write_usd_per_million: 2.00
      output_usd_per_million: 6.00

# Small helper calls that are not a conversation or a research task (token review item 5,
# 2026-10-20): the Ask route classifier left the conversation model (Fable 5.1 at the time) for
# Haiku 5.5 with thinking off and a structured reply. Each model must be on the allowlist.
helpers:
  route_classifier: {model: claude-haiku-5-5, max_tokens: 64}

# The models a user may choose (owner decision 2026-10-14, Phase 4B section 1): a research model
# (planning, which also runs the sense check and distill, pulling, extraction and classification:
# tiers planner, extractor, classifier) and an analysis model (Ask, synthesis, narrative and the
# judge: tiers synthesis, narrative, judge). Which tier belongs to which role is the routing
# table (src/llm/route.py TIERS); ADR-0116 keeps the Summary writer on the planner tier. The
# defaults are the owner's split. The admin enables
# models for the platform and may narrow them per client. Every enabled model is allowed for every
# client by default (owner decision 2026-10-15, was: Kimi K3 off until allowed per client); an
# admin can still remove one on the client's page. `features` says what the model has here;
# nothing assumes a feature a model does not list.
choices:
  # analysis default Opus 5.5 (token review item 4, 2026-10-20: was Fable 5.1, 2.5x the price);
  # Fable 5.1 stays a choice in every model menu
  defaults: {research: claude-opus-5-5, analysis: claude-opus-5-5}
  # The effort a user picks for each role, beside its model (owner decision 2026-10-20: medium or
  # high for every model, chosen in the frontend). The chosen effort serves the judgment tiers of
  # its role (research: planning, which runs the sense check and distill; analysis: Ask,
  # synthesis, narrative, the judge) and replaces their task_settings effort. Extraction and
  # classification keep their task_settings effort (low) unless config/agents.yaml names one
  # (ADR-0114, 2026-11-03: a run that stored medium paid extraction at medium). A user who has
  # not chosen gets the default.
  efforts: [medium, high]
  default_effort: {research: medium, analysis: medium}
  needs_client_permission: []
  models:
    - id: claude-opus-5-5
      label: "Opus 5.5"
      name: "Claude Opus 5.5"
      line: "Most capable, slower"
      key_env: ANTHROPIC_API_KEY
      features: [strict_json, web_search, citations, adaptive_thinking, prompt_caching]
    - id: claude-fable-5-1
      label: "Fable 5.1"
      name: "Claude Fable 5.1"
      line: "Fast and strong"
      key_env: ANTHROPIC_API_KEY
      features: [strict_json, web_search, citations, adaptive_thinking, prompt_caching]
    - id: kimi-k3
      label: "Kimi K3"
      name: "Kimi K3"
      line: "Kimi K3 by Moonshot AI"
      key_env: MOONSHOT_API_KEY
      features: [strict_json]
    # owner decision 2026-10-20: every Claude model is a choice, to try them per role
    - id: claude-sonnet-5-5
      label: "Sonnet 5.5"
      name: "Claude Sonnet 5.5"
      line: "Fast and economical"
      key_env: ANTHROPIC_API_KEY
      features: [strict_json, web_search, citations, adaptive_thinking, prompt_caching]
    - id: claude-haiku-5-5
      label: "Haiku 5.5"
      name: "Claude Haiku 5.5"
      line: "Fastest and cheapest, for simple work"
      key_env: ANTHROPIC_API_KEY
      features: [strict_json, adaptive_thinking, prompt_caching]
    # owner decision 2026-10-20: xAI Grok 4.5, allowed for every client
    - id: grok-4.5
      label: "Grok 4.5"
      name: "Grok 4.5"
      line: "Grok 4.5 by xAI"
      key_env: XAI_API_KEY
      features: [strict_json]
