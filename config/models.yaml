# Model routing per task. The Phase 0 model split benchmark decides which arm becomes active;
# until the decision log is signed, the choice is PROPOSED and reversible by editing this file.
# Source: roadmap s6 model split benchmark, s8 model routing, s12 LLM access; service design s4.3.
version: "1.0.0"

# Tasks a run delegates to a model. Each must be routed in every arm.
tasks:
  - pull_planning        # deciding which pulls and queries to run
  - extraction           # reading pulled sources into rows
  - classification       # job posting classes, levels, lanes
  - synthesis            # hypotheses and what changes a decision
  - narrative            # Summary narrative and first call questions
  - verification         # re-reading sources for claims

# Model profiles. Prices are left empty until confirmed from the provider's price list;
# the benchmark reports tokens and leaves cost blank while a price is missing.
profiles:
  fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    input_usd_per_mtok: null
    output_usd_per_mtok: null
  strong:
    provider: anthropic
    model: claude-opus-5-5
    input_usd_per_mtok: null
    output_usd_per_mtok: null
  offline:
    provider: fake
    model: fake-model
    input_usd_per_mtok: 0
    output_usd_per_mtok: 0

# Benchmark arms (roadmap s6): one model for everything versus a split by task.
arms:
  single:
    description: "One model for the whole run (today's setup)"
    routes:
      pull_planning: strong
      extraction: strong
      classification: strong
      synthesis: strong
      narrative: strong
      verification: strong
  split:
    description: "Fast model for pulls and extraction, strong model for analysis and deliverables"
    routes:
      pull_planning: fast
      extraction: fast
      classification: fast
      synthesis: strong
      narrative: strong
      verification: strong

# Arm used by runs. Status PROPOSED until the decision log is signed.
active_arm: single
decision_status: Proposed
