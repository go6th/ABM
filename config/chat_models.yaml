# Public chat model catalogue: the chat allow-list and chat-only settings. Every id must be a
# model of config/models.yaml, which holds its provider, display name, context window and prices
# (the one price table, ADR-0115; test_single_price_table fails on a price here).
# Enforced by the backend. Callers cannot override model selection.
version: 1
default_model: claude-sonnet-5-5
limits:
  max_turns: 1000
  max_input_chars: 60000
  max_output_tokens: 2048
  max_spend_usd_per_thread: "1000.00"
providers:
  anthropic:
    enabled: true
    credential_source: env_or_secret_manager
  moonshot:
    enabled: true
    credential_source: env_or_secret_manager
  xai:
    enabled: true
    credential_source: env_or_secret_manager
# max_output_tokens: the most a chat reply may ask for on this model (at most its models.yaml
# maximum)
models:
  - id: claude-sonnet-5-5
    max_output_tokens: 128000
    capabilities: {streaming: true, vision: false, tool_use: false}
  # the Ask route classifier's model (models.yaml `helpers`)
  - id: claude-haiku-5-5
    max_output_tokens: 128000
    capabilities: {streaming: true, vision: false, tool_use: false}
  - id: claude-fable-5-1
    max_output_tokens: 128000
    capabilities: {streaming: true, vision: false, tool_use: false}
  - id: claude-opus-5-5
    max_output_tokens: 128000
    capabilities: {streaming: true, vision: false, tool_use: false}
  - id: kimi-k3
    max_output_tokens: 131072
    capabilities: {streaming: true, vision: false, tool_use: false}
  - id: grok-4.5
    max_output_tokens: 128000
    capabilities: {streaming: true, vision: false, tool_use: false}
