# Production overrides; the strictest slice and concurrency limits for deployed runs.
environment: production
log_level: INFO
slice_seconds: 240
max_slices: 60
tenant_concurrency: 5
raw_payload_backend: s3
raw_payload_root: null
cloud_region: null
cloud_region_decision: D-05
secrets_from_environment:
  - DATABASE_URL
  - MIGRATOR_DATABASE_URL
  - CHECKPOINT_DATABASE_URL
  - APP_RW_PASSWORD
  - JWKS_URL
  - JWT_AUDIENCE
  - JWT_ISSUER
  - OBJECT_STORAGE_KMS_KEY
deployment:
  status: not_configured
  blockers: [cloud_account, region_decision_D-05, IaC_review, S3_backend, counsel_approval]
