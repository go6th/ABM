# Local password policy for the first-party identity issuer. Policy is versioned with the code;
# password checks are local and make no external requests.
version: "1.0.0"
rate_limits:
  # Per-process values are used only in local dev/test. Cloud runs use the shared Redis buckets.
  ip_capacity: 30
  ip_refill_per_second: 0.5
  account_capacity: 10
  account_refill_per_second: 0.1
password:
  min_length: 12
  max_length: 128
  argon2id:
    time_cost: 3
    memory_cost_kib: 65536
    parallelism: 2
    hash_len: 32
    salt_len: 16
  common_passwords:
    - "123456"
    - "123456789"
    - "12345678"
