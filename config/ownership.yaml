# Owned tables created after migration 0063 with the owner column and the tenant-and-owner policy
# built in (the generator leaves them alone; the tests check them like the others).
created_owned:
  user_preferences: a user's research and analysis model choices (migration 0064)
  user_limits: a user's own research and chat limits when the admin changed them (0065)
  usage_periods: the researches and chats a user has used per period (0065)
  limit_requests: a user's requests for more researches or chats (0065)
  document_parts: the parts of a document being read, owned by its owner (0066)
  download_jobs: a user's "Download everything" archive builds (0068)

tenant:
  # identity, access and the client's own settings
  users: client directory; each user's own row is read by sign-in and the admin
  memberships: who may enter the client, with role and access state
  membership_events: membership history for the client admin and audit
  auth_events: sign-in events, read by security and audit
  auth_sessions: sessions, keyed by token hash
  login_states: pending sign-ins (no user yet)
  saml_assertion_ids: replay protection for the client's IdP
  idp_connections: the client's SSO connections, managed by the client admin
  support_grants: the client admin's grant for View as a client
  support_session_events: support access history
  client_settings: limits and features the 6th admin sets for the client
  tenant_events: client lifecycle (suspended, reactivated)
  tenant_model_credentials: client-level model key (retired; kept until removed)
  tenant_rules: client-level rules set by the client admin
  tenant_rule_accounts: which accounts a client rule applies to (rule data, not research)
  tenant_settings_versions: history of client settings
  branding_assets: client branding for deliverables
  document_policies: client redaction policy
  people_data_consents: the client's consent records for people data
  shelf_life_overrides: client-level freshness settings
  alert_suppressions: client-level alert rules
  library_publications: which 6th Library accounts are published to the client
  question_categories: question category counts (no question text), read by the 6th admin
  # money, metering and the paid-call ledger: the client's pool and the platform's cost truth,
  # read by the system and by Runs and spend; no user screen shows them, and a user reaches a
  # run's calls only through an owned run
  wallets: the client's credit pool
  wallet_ledger: credit pool movements
  credit_entries: credit reservations and settlements
  balance_snapshots: pool snapshots
  spend_defects: spend invariant findings for the owner
  spend_limit_events: spend limit history
  spend_reports: nightly spend reports
  unit_cost_rollups: cost rollups
  ops_cost_rollups: cost rollups for Runs and spend
  ops_rollup_watermarks: rollup progress
  usage_counters: client metering
  usage_events: client metering
  usage_thresholds: client metering thresholds
  quota_versions: client quota history
  plan_assignments: client plan
  monitoring_budget_versions: client monitoring budget
  monitoring_usage: client monitoring usage
  throttle_events: provider throttling history
  tool_calls: the paid-call ledger (idempotency across runs; never pay twice)
  tool_call_records: raw call records of the ledger
  tool_call_events: ledger events
  llm_calls: model call records
  llm_call_attempts: model call attempts
  model_reply_log: the research cache's reply log (private task kinds are never reused across users)
  provider_leases: provider concurrency leases shared by the client's runs
  provider_waiters: provider concurrency queue
  run_leases: worker leases on runs
  run_anomaly_events: run anomaly detector findings
  stuck_run_observations: sweeper observations
  # platform operations
  audit_events: the client's audit log
  audit_chain_checks: audit hash-chain checks
  canary_probe_results: isolation canary probes
  eval_runs: evaluation runs
  eval_case_results: evaluation results
  eval_metrics: evaluation metrics
  eval_baselines: evaluation baselines
  tombstones: deletion tombstones
  webhook_receipts: inbound webhook replay protection
  crm_connection_events: the client's CRM connection history (CRM is being removed)

# Keys that were unique per client and become unique per user, so two users of one client never
# collide or dedupe into each other's rows (a re-uploaded file, a repeated request).
unique_per_owner:
  - {table: account_runs, constraint: account_runs_tenant_id_idempotency_key_key, columns: [idempotency_key]}
  - {table: research_files, constraint: uq_research_files_tenant_sha256, columns: [sha256]}
  - {table: research_jobs, index: uq_research_jobs_request, columns: [request_id], where: "request_id IS NOT NULL"}
