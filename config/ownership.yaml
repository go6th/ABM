# Private workspaces (owner decision 2026-10-14, Phase 4B section 7). Every tenant table is in
# exactly one of the two lists below; tests/isolation/test_ownership.py fails on a table in
# neither. INTERNAL.
#
# owned: rows belong to one user of the client. The table has `owner_user_id` (added where
# missing, NOT NULL, default the transaction's app.user_id) and its app_rw policy is
#   tenant_id = app_tenant() AND owner_visible(owner_user_id)
# so the database refuses another user's rows. `from` says how existing rows get their owner
# (scripts/gen_ownership_migration.py writes migration 0063 from this file, in this order):
#   column: <c>                  the row's own column holding the user (copied)
#   account                      the owner of accounts(id = account_id)
#   run                          the owner of account_runs(id = run_id), else runs(id = run_id)
#   parent: <table>.<column>     the owner of <table>(id = <column>), listed earlier
# A row whose owner cannot be found gets the client's first user (users.created_at), and each
# such choice is counted in `ownership_backfill`.
#
# tenant: rows are the client's, not one user's, with the reason. Users reach none of these
# directly; anything a user screen shows from them is reached through an owned row.
version: "2026-10-14.1"

owned:
  accounts: {column: added_by}
  account_runs: account
  runs: account
  account_source_counters: account
  research_jobs: account
  notifications: {column: user_id}
  abm_distill_outputs: run
  abm_sense_checks: run
  alerts: account
  alert_feedback: {column: user_id}
  alert_outbox: {parent: alerts.alert_id}
  chat_threads: {column: owner_user_id}
  chat_turns: {parent: chat_threads.thread_id}
  chunks: account
  claim_drops: run
  connector_connections: {column: owner_user_id}
  connector_items: {column: owner_user_id}
  connector_oauth_states: {column: user_id}
  connector_access_log: {parent: connector_connections.connection_id}
  connector_grants: {parent: connector_connections.connection_id}
  connector_quarantine: {parent: connector_connections.connection_id}
  coverage_rows: run
  coverage_row_events: run
  crm_mappings: account
  crm_writes: account
  crm_write_events: {parent: crm_writes.write_id}
  deliverables: account
  deltas: account
  delta_items: {parent: deltas.delta_id}
  digest_runs: {column: user_id}
  documents: {column: uploaded_by}
  document_deletions: {parent: documents.document_id}
  document_passages: {parent: documents.document_id}
  document_redactions: {parent: documents.document_id}
  export_packages: account
  export_verifications: {parent: export_packages.package_id}
  facts: account
  fact_evidence: {parent: facts.fact_id}
  fact_reevaluations: account
  grade_events: {parent: facts.fact_id}
  intake_drops: account
  internal_deliverables: account
  job_pipeline_runs: account
  job_pipeline_passes: run
  job_postings: account
  job_posting_classifications: run
  job_posting_observations: account
  job_posting_platform_sentences: run
  lead_verifications: run
  lead_verification_queries: {parent: lead_verifications.lead_verification_id}
  leak_checks: account
  link_checks: run
  missing_observations: account
  monitor_configs: account
  monitor_runs: account
  notification_outbox: run
  notification_deliveries: {parent: notification_outbox.outbox_id}
  people: account
  people_pipeline_runs: account
  person_events: account
  person_post_pulls: account
  person_posts: account
  person_profiles: account
  person_search_pages: account
  person_sources: account
  prepulled_intents: run
  prepulled_intent_events: {parent: prepulled_intents.intent_id}
  prepulled_files: run
  pull_manifests: run
  refresh_runs: account
  refresh_row_plans: {parent: refresh_runs.refresh_run_id}
  refresh_slots: account
  report_sections: account
  research_files: {column: uploaded_by}
  research_file_chunks: {parent: research_files.file_id}
  research_file_deletions: {parent: research_files.file_id}
  research_file_findings: {parent: research_files.file_id}
  research_file_model_calls: {parent: research_files.file_id}
