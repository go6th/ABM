services:
  db:
    image: pgvector/pgvector:pg16
    container_name: abm-generator-db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai -q"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
