services:
  db:
    image: pgvector/pgvector:pg16
    container_name: abm-generator-db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai -q"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Temporal dev server (single binary, in-memory). Local only; staging and production use
  # the managed or self-hosted cluster chosen with the cloud (roadmap s12).
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "default"]
    ports:
      - "7233:7233"
      - "8233:8233"

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    depends_on:
      - temporal
    environment:
      ENV: dev
      TEMPORAL_ADDRESS: temporal:7233
      MODEL_MODE: fake
      BROKER_MODE: recorded
    restart: on-failure

volumes:
  pgdata:
