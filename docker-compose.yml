services:
  db:
    image: pgvector/pgvector:pg16
    container_name: abm-generator-db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai -q"]
      interval: 5s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for raw broker JSON and exports (data layer v1).
  # Official MinIO images are no longer publicly pullable; pgsty/minio is the maintained
  # community build of the same server. The API is unchanged, so swapping it later is one line.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-minioadmin-dev}
      MINIO_REGION: ${OBJECT_STORE_REGION:-us-east-1}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: creates the bucket once MinIO is healthy. Safe to rerun; never deletes.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        echo "bucket $$BUCKET ready"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-minioadmin-dev}
      BUCKET: ${OBJECT_STORE_BUCKET:-account-intelligence-dev}
    restart: "no"

  # Temporal dev server (single binary, in-memory). Local only; staging and production use
  # the managed or self-hosted cluster chosen with the cloud (roadmap s12).
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "default"]
    ports:
      - "7233:7233"
      - "8233:8233"

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    depends_on:
      - temporal
    environment:
      ENV: dev
      TEMPORAL_ADDRESS: temporal:7233
      MODEL_MODE: fake
      BROKER_MODE: recorded
    restart: on-failure

volumes:
  pgdata:
  miniodata:
