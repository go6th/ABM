# Default people scope. Source: PRD s3.3 inputs and s3.4 people; roadmap s7 people pipeline.
# Per-tenant overrides arrive with tenant settings in Phase 3 (roadmap s9).
version: "1.0.0"

# Seniority kept (PRD s3.3: Director and above, Head, Senior Manager. Global).
levels_in_scope: [C-level, EVP, SVP, VP, Head, Director, Senior Manager]

# Functions excluded (PRD s3.3, roadmap s7). Matched case-insensitively against the title.
excluded_title_terms:
  - security
  - it compliance
  - it audit

# Merge order (roadmap s7, s11.1): profile URL first, then name.
merge_keys: [profile_url, name]
