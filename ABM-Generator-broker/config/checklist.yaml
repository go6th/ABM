# Coverage checklist. Source: PRD Appendix A (33 rows: 5 in pass 1, 28 in pass 2).
# Shelf lives come from the service design s5.1 suggested cadences. Rows with no cadence
# in the source documents have no shelf life yet; the analyst sets them (roadmap s10).
# 1.1.0: added the five s5.1 cadences 1.0.0 missed (found by the alignment check).
version: "1.1.0"

statuses: [Done, Partial, Not done, Blocked, None]
proof_fields: [queries, tool, result_count]

shelf_lives:
  job_board:
    days: 7
    basis: "Service design s5.1: live job board by lane, weekly"
  job_postings:
    days: 30
    basis: "Service design s5.1: job openings feed, monthly"
  news:
    days: 7
    basis: "Service design s5.1: news events, weekly"
  leadership:
    days: 7
    basis: "Service design s5.1: leadership changes, weekly"
  technology:
    days: 30
    basis: "Service design s5.1: technology detections, monthly"
  earnings:
    days: 90
    basis: "Service design s5.1: earnings and filings, quarterly"
  people_list:
    days: 90
    basis: "Service design s5.1: senior people list, quarterly"
  profiles:
    days: 90
    basis: "Service design s5.1: profiles of priority A people, quarterly"
  posts:
    days: 30
    basis: "Service design s5.1: posts of priority A people, monthly (only people with recent activity)"
  person_content:
    days: 30
    basis: "Service design s5.1: speaking, podcasts, content, monthly"
  review_sites:
    days: 90
    basis: "Service design s5.1: review sites and communities, quarterly"
  unset:
    days: null
    basis: "No cadence in the source documents; analyst to set in the Phase 4 shelf-life policy"

