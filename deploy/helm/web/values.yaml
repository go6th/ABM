replicaCount: 2
image:
  repository: ghcr.io/go6th/abm/web
  digest: ""
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: ""
apiOrigin: http://api:8080
operator:
  redirectUri: ""
  workspaceDomain: ""
externalSecrets:
  enabled: false
  secretStoreName: ""
  remoteKeys:
    operatorGoogleClientId: ""
    operatorGoogleClientSecret: ""
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
rollouts:
  enabled: false
  pauseDuration: 60s
nodeSelector:
  pool: api
tolerations: []
affinity: {}
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
networkPolicy:
  enabled: true
  allowHttpsEgress: true
  apiNamespace: account-intelligence
  apiPodLabels:
    app.kubernetes.io/name: account-intelligence-api
