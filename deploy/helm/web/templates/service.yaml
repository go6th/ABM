apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-web.fullname" . }}
  labels:
    {{- include "ai-web.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-web.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- if .Values.rollouts.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-web.fullname" . }}-canary
  labels:
    {{- include "ai-web.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-web.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- end }}
