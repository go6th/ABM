{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ai-web.fullname" . }}-operator-oauth
  labels:
    {{- include "ai-web.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "externalSecrets.secretStoreName must be set" .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "ai-web.fullname" . }}-operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: operator-google-client-id
      remoteRef:
        key: {{ required "externalSecrets.remoteKeys.operatorGoogleClientId must be set" .Values.externalSecrets.remoteKeys.operatorGoogleClientId }}
    - secretKey: operator-google-client-secret
      remoteRef:
        key: {{ required "externalSecrets.remoteKeys.operatorGoogleClientSecret must be set" .Values.externalSecrets.remoteKeys.operatorGoogleClientSecret }}
{{- end }}
