{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-web.fullname" . }}
  labels:
    {{- include "ai-web.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ required "ingress.className must be set" .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.host must be set" .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tlsSecretName must be set" .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-web.fullname" . }}
                port: { number: 80 }
{{- end }}
