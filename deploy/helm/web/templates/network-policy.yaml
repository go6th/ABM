{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-web.fullname" . }}
  labels:
    {{- include "ai-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-web.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apiNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.apiPodLabels | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
{{- end }}
