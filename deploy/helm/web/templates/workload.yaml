{{- $name := include "ai-web.fullname" . -}}
{{- $image := required "image.digest must be set to an immutable image digest" .Values.image.digest -}}
{{- if .Values.rollouts.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "ai-web.selectorLabels" . | nindent 6 }}
  {{- if .Values.rollouts.enabled }}
  strategy:
    canary:
      stableService: {{ $name }}
      canaryService: {{ $name }}-canary
      steps:
        - setWeight: 10
        - pause: { duration: {{ .Values.rollouts.pauseDuration }} }
        - setWeight: 50
        - pause: { duration: {{ .Values.rollouts.pauseDuration }} }
        - setWeight: 100
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "ai-web.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ default $name .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: "{{ .Values.image.repository }}@{{ $image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: 0.0.0.0 }
            - { name: API_ORIGIN, value: {{ .Values.apiOrigin | quote }} }
            - { name: OPERATOR_GOOGLE_REDIRECT_URI, value: {{ .Values.operator.redirectUri | quote }} }
            - { name: STAFF_WORKSPACE_DOMAIN, value: {{ .Values.operator.workspaceDomain | quote }} }
            - name: OPERATOR_GOOGLE_CLIENT_ID_FILE
              value: /var/run/secrets/account-intelligence/operator-google-client-id
            - name: OPERATOR_GOOGLE_CLIENT_SECRET_FILE
              value: /var/run/secrets/account-intelligence/operator-google-client-secret
          volumeMounts:
            - { name: operator-oauth, mountPath: /var/run/secrets/account-intelligence, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: operator-oauth
          secret:
            secretName: {{ $name }}-operator-oauth
            optional: true
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
