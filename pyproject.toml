[project]
name = "account-intelligence"
version = "0.1.0"
description = "Account Intelligence platform foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "boto3>=1.35",
    "fastapi>=0.115",
    "inngest>=0.4",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude/skills/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: evaluation tests excluded from the standard check",
    "requires_postgres: requires the isolated PostgreSQL test database",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
