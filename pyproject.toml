[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abm-generator"
version = "0.1.0"
description = "ABM Generator - account intelligence research pipeline (Phase 0 implementation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ABM Generator Team" }]
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "greenlet>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/abm_generator"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "spikes"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "B",               # bugbear
    "UP",              # pyupgrade
    "S",               # bandit (incl. S110 try-except-pass)
    "C4",              # comprehensions
    "SIM",             # simplify
    "RET",             # return style
    "PL",              # pylint subset
    "RUF",             # ruff-specific
]
ignore = [
    "PLR0913", # many arguments tolerated in typed adapters
    "PLR2004", # numeric literals in tests / constants are fine
    "PLC0415", # imports inside functions are used deliberately in tests/migrations
    "PLW0603", # module-level engine singletons are the documented pattern here
    "UP042",   # str+Enum classes are intentional (serialized values)
    "UP047",   # generic function with TypeVar is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S105", "S106"]
"spikes/*" = ["T201", "S106", "PLR0912", "PLR0915"]
"scripts/*" = ["T201"]
"migrations/*" = ["E501", "S608"]
"docs/**" = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["abm_generator"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "eval: evaluation-harness tests (deselected in normal runs)",
    "spike: Phase 0 spike tests (may require live docker Postgres)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:alembic.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/abm_generator"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
