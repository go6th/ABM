[project]
name = "account-intelligence"
version = "0.1.0"
description = "Multi-tenant account research platform: sourced, graded briefs, people lists and alerts"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "inngest>=0.4",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "opentelemetry-api>=1.25",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_intelligence", "src/jobs"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = [".claude", "_review"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/account_intelligence/api/**/*.py" = ["B008"]  # FastAPI Depends()/Header() defaults

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "eval: agent evaluation tests (golden set); run only in the eval gate",
    "requires_postgres: requires the scratch PostgreSQL test database",
]

[tool.coverage.run]
source_pkgs = ["account_intelligence"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
