# Eval gate (D-50, D-51): a REQUIRED check on every pull request (branch protection: see
# docs/evals/ci-and-budget.md). `replay` runs on every pull request (recorded model outputs and
# provider cassettes; no network, no spend). `live` (2026-10-17: the five tabular questions of
# evals/tabular_gsk over the real GSK workspace fixture, Kimi K3 at temperature 0) runs on the
# nightly schedule, on demand (workflow_dispatch) and on a prompt/routing change; with no
# MOONSHOT_API_KEY secret it reports not_run, which BLOCKS the merge (E5: no override in
# code). `nightly` runs the full set on a schedule. The routing governance check fails a
# routing change with no decision.
name: eval

on:
  pull_request:
  workflow_dispatch: # the live tabular eval on demand
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.filter.outputs.model }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        name: Prompt, routing, agent or grading change?
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if git diff --name-only "$base" HEAD | grep -E \
            '^(src/account_intelligence/agents/|src/llm/|src/verify/|src/account_intelligence/grading/|config/model_routing.yaml|config/models.yaml|config/verify.yaml)'; then
            echo "model=true" >> "$GITHUB_OUTPUT"
          else
            echo "model=false" >> "$GITHUB_OUTPUT"
          fi

  eval:
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://app_rw:local-dev-only@localhost:5432/ai
      MIGRATOR_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai
      CHECKPOINT_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai
      ADMIN_MAINT_DSN: postgresql://postgres:dev@localhost:5432/postgres
      APP_RW_PASSWORD: local-dev-only
      PGPASSWORD: dev
      EVAL_REPORT_DIR: eval-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - name: Routing governance (R12)
        run: uv run --frozen python scripts/check_routing_governance.py
      - name: Contamination (E2)
        run: >-
          uv run --frozen python -m evalgate.cli contamination --labels evals/golden/labels
          --scan src/account_intelligence/agents/prompts src/verify/prompts tests/fixtures
      - name: Harness self-tests (E10)
        run: uv run --frozen pytest tests/evals/test_harness.py -p no:cacheprovider
      - id: replay
        name: Replay eval over the golden set
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --frozen pytest -m eval tests/evals -p no:cacheprovider
      - id: live
        name: Live tabular eval (Kimi K3 on the real GSK workspace)
        if: needs.changes.outputs.model == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          # the key is Ollama Cloud's (owner decision 2026-10-15)
          MOONSHOT_BASE_URL: https://ollama.com/v1
          MOONSHOT_API_DIALECT: ollama
          MOONSHOT_MODEL: kimi-k3:cloud
        timeout-minutes: 60
        run: |
          if [ -z "${MOONSHOT_API_KEY}" ]; then
            echo "no MOONSHOT_API_KEY secret: the live tabular eval cannot run"
            echo "outcome=not_run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if uv run --frozen pytest -m live tests/evals/test_tabular_gsk_live.py -p no:cacheprovider; then
            echo "outcome=ran" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=ran" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Gate (no override)
        run: |
          replay=$([ "${{ steps.replay.outcome }}" = "success" ] && echo ran || echo infrastructure_error)
          live="${{ steps.live.outputs.outcome || 'skipped' }}"
          trigger=pull_request
          [ "${{ needs.changes.outputs.model }}" = "true" ] && trigger=prompt_or_model_change
          [ "${{ github.event_name }}" = "schedule" ] && trigger=nightly
          baseline=$(find evals/baselines -maxdepth 1 -name "baseline-*.json" 2>/dev/null | sort | tail -1 || true)
          uv run --frozen python -m evalgate.cli gate \
            --candidate eval-out/eval-report.json ${baseline:+--baseline "$baseline"} \
            --trigger "$trigger" --modes "replay=$replay,live=$live" --out eval-out/gate.md
      - name: Report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-report
          path: eval-out/
