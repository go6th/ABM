# Staging: runs after ci succeeds on a push to main (and by hand for a commit that has a green ci
# run). The images are the ones ci built and tested; _deploy.yml pushes them, migrates, deploys by
# digest, smoke tests and rolls back on failure.
name: deploy-staging

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (must have a successful ci run)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  resolve:
    # Only a push to main: a pull request from a fork whose branch is named "main" also reports
    # head_branch main, but its ci event is pull_request.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ci_run_id: ${{ steps.pick.outputs.ci_run_id }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_ID: ${{ github.event.workflow_run.id }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$EVENT" == "workflow_run" ]]; then
            sha="$WF_SHA"; run_id="$WF_ID"
          else
            sha="$INPUT_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA" >&2; exit 2; }
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
              --branch main --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')"
            [[ -n "$run_id" && "$run_id" != "null" ]] || { echo "no successful ci run on main for $sha" >&2; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [resolve]
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      sha: ${{ needs.resolve.outputs.sha }}
      ci_run_id: ${{ needs.resolve.outputs.ci_run_id }}
