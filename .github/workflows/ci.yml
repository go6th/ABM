name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check src tests scripts spikes migrations
      - name: Format check (ruff format)
        run: ruff format --check src tests scripts spikes migrations
      - name: Type check (mypy strict)
        run: mypy
      - name: Start Postgres 16 + pgvector
        run: docker compose up -d db
      - name: Wait for database
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T db pg_isready -U postgres -d ai -q && break
            sleep 1
          done
          docker compose exec -T db pg_isready -U postgres -d ai
      - name: Apply migrations (owner role)
        env:
          MIGRATOR_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai
        run: alembic upgrade head
      - name: Unit tests + coverage >= 80%
        run: pytest tests/unit --cov=src/abm_generator --cov-fail-under=80 -q
      - name: Isolation suite (hard gate, live Postgres)
        run: pytest tests/isolation -x -q
      - name: Durability spike tests
        run: pytest tests/spike -q -m spike
      - name: Requirements checker (T3)
        run: python scripts/check_requirements.py
      - name: Verification register checker (T7)
        run: python scripts/check_verification.py
      - name: ADR checker (T8): 16 ADRs, all Accepted
        run: python scripts/check_adrs.py
      - name: Conflict register checker (T4): 10 rows, all decided
        run: python scripts/check_conflicts.py
      - name: Reference doc checker (T1): 33 coverage rows, 4 grades, 13 steps
        run: python scripts/check_reference.py
      - name: Golden set checker (T9): template validates against schema
        run: python scripts/check_golden_set.py
      - name: Phase0 doc count checker (T1/T2/T5/T6/T14)
        run: python scripts/check_phase0_docs.py
      - name: Secret scan (no committed .env)
        run: "! git ls-files | grep -E '^\\.env$' "
