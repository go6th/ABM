# CI: every gate on each pull request; on main, a staging deploy through Workload Identity
# Federation (no key file). The deploy job is skipped until the owner sets the repository variables
# STAGING_WIF_PROVIDER and STAGING_DEPLOYER_SA (terraform outputs, docs/runbooks/deploy.md) and is
# gated by the "staging" environment's required reviewers.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://app_rw:local-dev-only@localhost:5432/ai
      MIGRATOR_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai
      CHECKPOINT_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai
      ADMIN_MAINT_DSN: postgresql://postgres:dev@localhost:5432/postgres
      APP_RW_PASSWORD: local-dev-only
      PGPASSWORD: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen
      - name: Cloud Storage and Cloud Tasks emulators (port contract tests)
        run: |
          docker run -d -p 4443:4443 fsouza/fake-gcs-server:latest \
            -scheme http -port 4443 -public-host localhost:4443
          docker run -d -p 8123:8123 ghcr.io/aertje/cloud-tasks-emulator:latest \
            -host 0.0.0.0 -port 8123 -initial-queue projects/dev/locations/here/queues/runs
      - name: Lint and types
        run: make lint
      - name: Static gates (W1 imports, docstrings, comments, guarantees, loops, bandit, vulture)
        run: make static
      - name: Isolation suite first (hard gate), then everything except evals, coverage gate
        run: |
          uv run --frozen pytest tests/isolation -x -p no:cacheprovider
          uv run --frozen pytest -m "not eval" -p no:cacheprovider \
            --cov=account_intelligence --cov=jobs --cov-fail-under=90

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: terraform fmt and validate (no backend, no credentials, nothing applied)
        run: make infra-fmt infra-validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t account-intelligence:local .

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_WIF_PROVIDER != ''
    needs: [quality, infra, image]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write  # the OIDC token Workload Identity Federation exchanges
    env:
      REGION: ${{ vars.STAGING_REGION }}
      PROJECT: ${{ vars.STAGING_PROJECT_ID }}
      IMAGE: ${{ vars.STAGING_REGION }}-docker.pkg.dev/${{ vars.STAGING_PROJECT_ID }}/ai-staging-images/account-intelligence:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Roll out api and worker
        run: |
          gcloud run deploy ai-staging-api --region "$REGION" --image "$IMAGE" --quiet
          gcloud run deploy ai-staging-worker --region "$REGION" --image "$IMAGE" --quiet
      - name: Readiness must be 200 (it fails closed)
        run: |
          url="$(gcloud run services describe ai-staging-api --region "$REGION" --format 'value(status.url)')"
          curl -fsS "$url/readyz"
