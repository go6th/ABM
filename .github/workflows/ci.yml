# CI: every gate on each pull request and on main. No cloud credentials are used here; deployments
# live in deploy-staging.yml and deploy-prod.yml (Workload Identity Federation, protected
# environments). Images are built, scanned (Trivy, fail on fixable HIGH/CRITICAL), described by a
# CycloneDX SBOM, and on main signed keylessly with cosign (GitHub OIDC; no key material).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: actionlint (workflow syntax, expressions, shell)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://app_rw:local-dev-only@localhost:5432/ai_test
      MIGRATOR_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai_test
      CHECKPOINT_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai_test
      ADMIN_MAINT_DSN: postgresql://postgres:dev@localhost:5432/postgres
      APP_RW_PASSWORD: local-dev-only
      TEST_DB: ai_test
      PGPASSWORD: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen
      - name: Cloud Storage and Cloud Tasks emulators (port contract tests)
        run: |
          docker run -d -p 4443:4443 fsouza/fake-gcs-server:latest \
            -scheme http -port 4443 -public-host localhost:4443
          docker run -d -p 8123:8123 ghcr.io/aertje/cloud-tasks-emulator:latest \
            -host 0.0.0.0 -port 8123 -initial-queue projects/dev/locations/here/queues/runs
      - name: Environment registry (typed, fail fast)
        run: uv run --frozen python -m account_intelligence.config
      - name: Lint and types
        run: make lint
      - name: Static gates (W1 imports, docstrings, comments, guarantees, loops, bandit, vulture)
        run: make static
      - name: API and frontend wiring contract
        run: make contract
      - name: Observability contract (catalogs, generated Terraform, runbooks, canary suite)
        run: |
          uv run --frozen python scripts/check_telemetry.py
          uv run --frozen python scripts/gen_observability.py --check
          uv run --frozen python scripts/check_runbooks.py
      - name: Isolation first (hard gate), then all but evals (fuzz, backup/restore); coverage 94%
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          uv run --frozen pytest tests/isolation -x -p no:cacheprovider
          uv run --frozen pytest -m "not eval" -p no:cacheprovider -W error::pytest.PytestWarning --cov

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: terraform fmt and validate (no backend, no credentials, nothing applied)
        run: make infra-fmt infra-validate
      - name: terraform offline plan tests (mock providers; no credentials, no API calls)
        run: make infra-test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: TypeScript contract
        run: npm run typecheck
        working-directory: web
      - name: ESLint
        run: npm run lint
        working-directory: web
      - name: Web unit tests
        run: npm test
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DB: ai_e2e
      PGPASSWORD: dev
      APP_RW_PASSWORD: local-dev-only
      MIGRATOR_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai_e2e
      CHECKPOINT_DATABASE_URL: postgresql://postgres:dev@localhost:5432/ai_e2e
      DATABASE_URL: postgresql+asyncpg://app_rw:local-dev-only@localhost:5432/ai_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - name: Create and migrate the E2E database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c "CREATE DATABASE ai_e2e"
          uv run --frozen alembic upgrade head
      - name: Build the web app and install the browser
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          API_ORIGIN=http://127.0.0.1:8088 npm run build
          npx playwright install --with-deps chromium
      - name: Playwright (sign-in, roles, isolation, keyboard, axe WCAG 2.1 AA, run flow)
        working-directory: web
        run: npx playwright test

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless cosign signing on main (GitHub OIDC)
      packages: write   # push to GHCR on main only
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: docker/api.Dockerfile }
          - { name: worker, context: ., file: docker/worker.Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build
        run: docker build -f "${{ matrix.file }}" -t "ai-${{ matrix.name }}:ci" "${{ matrix.context }}"
      - name: Trivy (fail on fixable HIGH and CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "ai-${{ matrix.name }}:ci"
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.75.0 image --format cyclonedx \
            --output "/out/sbom-${{ matrix.name }}.cdx.json" "ai-${{ matrix.name }}:ci"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
      - name: Push and sign keylessly (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REF: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "ai-${{ matrix.name }}:ci" "$REF"
          docker push "$REF"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REF")"
          oidc="$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r .value)"
          docker run --rm -e SIGSTORE_ID_TOKEN="$oidc" -v "$HOME/.docker:/root/.docker:ro" \
            ghcr.io/sigstore/cosign/cosign:v3.1.3 sign --yes "$digest"
