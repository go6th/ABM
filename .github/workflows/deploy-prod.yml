# Production: manual only, for a commit that already has a green ci run on main AND a successful
# staging deploy. The `production` GitHub environment has required reviewers, so the deploy job
# waits for the owner's approval before it can read the environment's variables or authenticate.
# The images are the bytes ci tested and staging ran; nothing is rebuilt.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to promote (deployed to staging and smoke tested)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ci_run_id: ${{ steps.pick.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="$INPUT_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA" >&2; exit 2; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main" >&2; exit 1; }
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --branch main --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')"
          [[ -n "$run_id" && "$run_id" != "null" ]] || { echo "no successful ci run on main for $sha" >&2; exit 1; }
          staged="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-staging.yml \
            --status success --limit 50 --json headSha --jq "[.[] | select(.headSha == \"$sha\")] | length")"
          [[ "$staged" -ge 1 ]] || { echo "$sha has no successful staging deploy" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [resolve]
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      sha: ${{ needs.resolve.outputs.sha }}
      ci_run_id: ${{ needs.resolve.outputs.ci_run_id }}
