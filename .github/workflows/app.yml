name: app

# Roadmap Phase 0: CI green on every commit. Runs on every push to any branch and on PRs.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Empty Postgres 16 for the data layer migration tests (tests/app/db).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check app tests/app
      - name: Format check (ruff format)
        run: ruff format --check app tests/app
      - name: Type check (mypy strict)
        run: mypy -p app
      - name: Tests (pytest; Temporal hello-world and data layer migrations included)
        run: pytest tests/app -q -rs
      - name: Data layer migrations, upgrade head and downgrade base on an empty database
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
        run: |
          alembic -c app/db/alembic.ini upgrade head
          alembic -c app/db/alembic.ini downgrade base
      - name: Benchmarks run offline
        run: |
          python -m app.benchmarks.model_split --out build/benchmarks
          python -m app.benchmarks.people_source --out build/benchmarks

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: fmt and validate (dev, staging, production)
        run: make tf-validate
      - name: Staging deploy dry run (plan only)
        env:
          DRY_RUN: "1"
          SKIP_CHECKS: "1"
        run: scripts/deploy.sh staging
