# SYNTHETIC people corpus for the people pipeline tests. Every name, URL, employer and text here is
# invented; no real person, account or provider response is represented. Provider codes are the
# internal codes only. Record shapes follow the pipeline's RawPerson / RawProfile / RawPost
# contract (the real provider shapes are [VERIFY] V-PEOPLE-1 to 3).
label: synthetic
account_domain: synthetic-acme.example.com
as_of: "2026-10-03"
lanes_off: [veeva]
reference_employers: ["Synthetic Client Co"]
budget_usd: 1.0

# Title search pages per source id. Page 0 answers cursor null; `cursor_pages` maps a cursor to
# the page it returns. `fail` raises a source failure with a ledger key.
