# Isolation matrix (TN1). SYNTHETIC. The generator (scripts/gen_isolation_matrix.py) discovers
# every tenant object from the database catalog, the application's route table and the
# registries in src/tenancy/catalog.py; every discovered object must have an entry here, and an
# entry for an object that no longer exists is also an error. The generated tests
# (tests/isolation/test_matrix.py) attempt, as tenant B, every cross-tenant operation against
# tenant A's planted canary.
#
# tables: an entry may be {} (the catalog synthesiser plants the canary on its own) or carry
#   `plant:` column overrides for what CHECK constraints the synthesiser cannot read demand.
#   Placeholders: {tenant} {uuid} {canary} {hex64}.
# views: every public view; `tenant_column` names the column the probe filters on.
# routes, storage, cache, events: see the comments on each section.
status: generated-coverage
tables:
  account_runs: {}
  account_source_counters: {}
  accounts:
    plant: {domain: "tn1-{hex64}.example"}
  balance_snapshots:
    plant: {status: unknown, provider_code: p_search}
  canary_probe_results: {}
  checkpoint_blobs: {}
  checkpoint_writes: {}
  checkpoints: {}
  chunks: {}
  claim_drops: {}
  coverage_row_events: {}
  coverage_rows: {}
  deliverables:
    plant: {object_key: "{uuid}/{uuid}/{uuid}/deliverables/{hex64}.docx"}
  eval_baselines: {}
  eval_case_results: {}
  eval_metrics: {}
  eval_runs: {}
  fact_evidence:
    plant: {evidence_kind: search_proof, call_ref: "{canary}"}
  facts:
    plant: {product_grade: hypothesis}
  grade_events: {}
  job_pipeline_passes: {}
  job_pipeline_runs: {}
  job_posting_classifications: {}
  job_posting_observations: {}
  job_posting_platform_sentences:
    plant: {start_offset: 0, end_offset: 5}
  job_postings:
    plant: {url: "https://jobs.example/{canary}"}
  lead_verification_queries:
    plant: {accepted: true}
  lead_verifications: {}
  llm_call_attempts: {}
  llm_calls: {}
  membership_events:
    plant: {event: added}
  memberships: {}
  notification_deliveries: {}
  notification_outbox: {}
  ops_cost_rollups: {}
  ops_rollup_watermarks: {}
  people:
    plant: {profile_url: "https://profiles.example/{canary}"}
  people_pipeline_runs: {}
  person_events:
    plant: {kind: scope}
  person_post_pulls: {}
  person_posts: {}
  person_profiles: {}
  person_search_pages: {}
  person_sources: {}
  prepulled_files:
    plant: {provider_code: p_search}
  prepulled_intent_events: {}
  prepulled_intents:
    plant: {quarantine_key: "quarantine/{canary}"}
  provider_leases: {}
  provider_waiters: {}
  report_sections: {}
  run_cap_events: {}
  run_cap_versions: {}
  run_coverage_meta: {}
  run_leases: {}
  runs: {}
  sources:
