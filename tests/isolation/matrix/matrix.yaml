# Storage layouts (tenancy.catalog.STORAGE_LAYOUTS): a sample key of tenant A must resolve to A,
# never to B, and a download token for it must be refused in B's session.
storage:
  raw_payload: {layout: "tenants/<tenant>/accounts/<account>/runs/<run>/raw/<sha256>.json.gz"}
  deliverable: {layout: "<tenant>/<account>/<run>/deliverables/<sha256>.<ext> (predates TN4)"}
  prepulled_quarantine: {layout: "quarantine/<tenant>/<run>/<intent>"}
  branding: {layout: "tenants/<tenant>/branding/<sha256>.png"}
  branding_upload_quarantine: {layout: "tenants/<tenant>/uploads/branding/<sha256>"}
  export_file: {layout: "tenants/<tenant>/exports/<run>/<sha256>.<ext>"}
  connector_quarantine: {layout: "tenants/<tenant>/connector-quarantine/<connection>/<sha256>"}
  document_quarantine: {layout: "tenants/<tenant>/quarantine/<document>/raw"}
  document: {layout: "tenants/<tenant>/documents/<document>/raw"}
  internal_file: {layout: "tenants/<tenant>/internal/<run>/<sha256>.docx"}
# Cache purposes (tenancy.catalog.CACHE_PURPOSES): keys start with t:<tenant>:<purpose>:.
cache:
  membership: {}
# Event types (tenancy.catalog.EVENT_TYPES): table-backed events name their table (covered by the
# table probes); queue payloads name the worker route that re-checks the tenant under RLS.
events:
  task.run_slice: {route: POST /tasks/run-slice}
  task.approval_timeout: {route: POST /tasks/approval-timeout}
  task.file_process: {route: POST /tasks/file-process}
  task.document_process: {route: POST /tasks/document-process}
  task.research_job: {route: POST /tasks/research-job}
  outbox.notification: {table: notification_outbox}
  audit.event: {table: audit_events}
  connector.access: {table: connector_access_log}
  usage.event: {table: usage_events}
  support.action: {table: support_session_events}
  pilot.feedback: {table: run_feedback}
  pilot.usefulness: {table: usefulness_events}
# Jobs (tenancy.catalog.JOBS): each runs per tenant inside tenant_txn or through a definer
# function returning identifiers only; `proof` names the test that exercises it.
jobs:
  spend_invariants: {via: spend_runs_to_check, proof: tests/spend}
  orphan_sweep: {via: runs_orphaned, proof: tests/system/test_durable_runs.py}
  file_sweep: {via: research_files_orphaned, proof: tests/research_files/test_pipeline_db.py}
  document_sweep: {via: documents_orphaned, proof: tests/documents/test_documents_db.py}
  stuck_scan: {via: tenant_txn, proof: tests/obs/test_obs_db.py}
  cost_rollup: {via: tenant_txn, proof: tests/obs/test_obs_db.py}
  isolation_probe: {via: tenant_txn, proof: tests/obs/test_obs_db.py}
  audit_chain_verify: {via: tenant_txn, proof: tests/phase3/test_ws3_audit.py}
  connector_fetch: {via: tenant_txn, proof: tests/phase3/test_ws6_connectors.py}
  usage_reconcile: {via: tenant_txn, proof: tests/phase3/test_ws7_metering.py}
