# Isolation matrix (TN1). SYNTHETIC. The generator (scripts/gen_isolation_matrix.py) discovers
# every tenant object from the database catalog, the application's route table and the
# registries in src/tenancy/catalog.py; every discovered object must have an entry here, and an
# entry for an object that no longer exists is also an error. The generated tests
# (tests/isolation/test_matrix.py) attempt, as tenant B, every cross-tenant operation against
# tenant A's planted canary.
#
# tables: an entry may be {} (the catalog synthesiser plants the canary on its own) or carry
#   `plant:` column overrides for what CHECK constraints the synthesiser cannot read demand.
#   Placeholders: {tenant} {uuid} {canary} {hex64}.
# views: every public view; `tenant_column` names the column the probe filters on.
# routes, storage, cache, events: see the comments on each section.
status: generated-coverage
tables:
  account_runs: {}
  account_source_counters: {}
  audit_chain_checks:
    plant: {ok: true, first_bad_seq: null, from_seq: 0, to_seq: 1}
  audit_events:
    plant: {action: read.runs, actor_kind: user, audit_class: read, resource_type: run,
            resource_id: "{canary}"}
  accounts:
    plant: {domain: "tn1-{hex64}.example"}
  auth_events:
    plant: {event: login_started}
  auth_sessions:
    plant: {absolute_expires_at: "2027-01-01T00:00:00+00:00", idle_timeout_s: 60}
  balance_snapshots:
