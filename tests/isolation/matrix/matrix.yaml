# Definer functions run with their owner's rights: each must be narrow and return identifiers
# only. `proof` names the test that pins that behaviour.
functions:
  governor_acquire: {returns: lease id or null, proof: tests/parallel}
  governor_active: {returns: a count for one provider, proof: tests/parallel}
  governor_configure: {returns: void, proof: tests/parallel}
  governor_heartbeat: {returns: boolean for the caller's own lease, proof: tests/parallel}
  governor_release: {returns: void, caller's own lease, proof: tests/parallel}
  governor_signal: {returns: void, proof: tests/parallel}
  spend_runs_to_check: {returns: (tenant_id, run_id) pairs only, proof: tests/spend}
  runs_orphaned: {returns: (tenant_id, run_id) pairs only, proof: tests/system/test_durable_runs.py}
  research_files_orphaned: {returns: (tenant_id, file_id) pairs only, proof: tests/research_files/test_pipeline_db.py}
  documents_orphaned: {returns: (tenant_id, document_id) pairs only, proof: tests/documents/test_documents_db.py}
  due_scheduled_refreshes: {returns: (tenant_id, account_id) pairs only, proof: tests/replica/test_schedules.py}
  tenants_with_waiting_jobs: {returns: tenant_id identifiers only, proof: tests/replica/test_schedules.py}
  tenants_with_credit_activity: {returns: tenant_id identifiers only, proof: tests/worker/test_nightly.py}
  library_publication_counts: {returns: (library_account_id, count) pairs only, proof: tests/replica/test_library.py}
  erase_rows:
    returns: a row count; the caller's context tenant only, allow-listed tables, approved requests
    proof: tests/phase3/test_ws1_tenancy.py
  idp_connection_tenant:
    returns: (tenant_id, connection_id) of one active connection by slug
    proof: tests/phase3/test_ws2_sso_api.py
  write_platform_tombstone:
    returns: whether one content-free platform tombstone was inserted; cannot read tenant data
    proof: tests/crosscut/test_x4_privacy.py
  login_state_tenant:
    returns: the tenant of one pending sign-in by the hash of its 256-bit state
    proof: tests/phase3/test_ws2_sso_api.py
  session_tenant:
    returns: the tenant of one session by the hash of its 256-bit token
    proof: tests/phase3/test_ws2_sso_api.py
  support_grant_tenant:
    returns: (tenant_id, scope) of one unrevoked, unexpired grant to exactly this operator
    proof: tests/phase3/test_ws8_admin.py
  operator_tenant_overview:
    returns: tenant ids, creation time, plan, suspension and counts; no names, no content
    proof: tests/phase3/test_ws8_admin.py
  pilot_aggregate:
    returns: per-tenant counts of usefulness events and verdicts; no subject, note or content
    proof: tests/phase3/test_ws9_pilot.py
  provision_tenant:
    returns: the id of one new tenant with an empty wallet; reads and changes nothing else
    proof: tests/phase3/test_ws8_admin.py
  local_auth_create:
    returns: the new identity UUID; no credential tables are directly accessible to app_rw
    proof: tests/phase3/test_ws2_local_auth.py
  local_auth_failure:
    returns: the atomic failure count and lock expiry for one normalized email; never logs email
    proof: tests/phase3/test_ws2_local_auth.py
  local_auth_issue_token:
    returns: whether a short-lived single-use hashed token was created
    proof: tests/phase3/test_ws2_local_auth.py
  local_auth_lookup:
    returns: credential fields for one normalized email to the backend authenticator only
    proof: tests/phase3/test_ws2_local_auth.py
  local_auth_memberships:
    returns: active tenant ids and roles for one verified local identity
    proof: tests/phase3/test_ws2_local_auth.py
  local_auth_reset_email:
    returns: the email for one live reset token only
    proof: tests/phase3/test_ws2_local_auth_api.py
  local_auth_reset_password:
    returns: identity UUID after consuming one reset token and replacing its password hash
    proof: tests/phase3/test_ws2_local_auth_api.py
  local_auth_success:
    returns: whether one verified active identity's lockout was cleared
    proof: tests/phase3/test_ws2_local_auth.py
  local_auth_verify_email:
    returns: the identity UUID after one live verification hash is consumed
    proof: tests/phase3/test_ws2_local_auth.py
# Routes. probe: tenant (called as tenant B with the authorisation layer replaced by a fixed
# tenant-B principal; path parameters filled from tenant A's canary rows; the reply must carry no
# value of A's canaries), operator (the same through an operator principal of tenant B), machine
# (worker routes: refused without a worker token even when the body names tenant A).
# anonymous (sign-in routes: no principal; called with A's identifiers, no session may be issued
# and only the values the protocol makes public, listed in `public`, may appear in the reply),
# staff (operator-plane platform routes: a 6th staff operator from the fake staff IdP and no
# tenant principal; an operator naming tenant A in the path must still see none of A's content).
# params: path parameter -> "table.column" of A's canary row.
routes:
  GET /v1/accounts/{domain}/workspace: {probe: tenant, params: {domain: accounts.domain}}
  GET /v1/accounts/{domain}/deliverables: {probe: tenant, params: {domain: accounts.domain}}
  GET /v1/accounts/{domain}/deliverables/download:
    probe: tenant
    params: {domain: accounts.domain}
    query: {ids: deliverables.id}
  GET /v1/chat/suggestions: {probe: tenant}
  GET /v1/credits: {probe: tenant}
  GET /v1/research/estimate: {probe: tenant}
  GET /v1/library/available: {probe: tenant}
  POST /v1/accounts/from-library:
    probe: tenant
    body: {library_account_ids: ["00000000-0000-4000-8000-000000000009"]}
