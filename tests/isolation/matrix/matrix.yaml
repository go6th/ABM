            url_normalized: "https://tn1.example/canary",
            url_hash: 4187a99b7a74361632f63d41a714fe66180164220722b7a9ab1ce373e2d899af}
  spend_defects:
    plant: {provider_code: p_search}
  spend_limit_events:
    plant: {request_id: "{uuid}"}
  spend_reports: {}
  stuck_run_observations: {}
  tech_detections: {}
  tenant_events:
